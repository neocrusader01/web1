<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two-Tier Birthday Cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Great+Vibes&display=swap">
<style>
/* Layout: one full-viewport cinematic scene; cake centred on a dark wooden table, title floating above. */
:root {
  --night-0: #0b1020;
  --night-1: #070b16;
  --night-2: #030407;
  --gold: #f3d38d;
  --gold-glow: rgba(255, 196, 110, 0.55);
  --ink-soft: rgba(236, 228, 214, 0.62);
  --glass: rgba(18, 20, 30, 0.38);
  --glass-line: rgba(255, 255, 255, 0.10);
  --font-hand: "Caveat", "Bradley Hand", "Segoe Print", "Marker Felt", cursive;
  --font-script: "Great Vibes", "Snell Roundhand", "Segoe Script", "Apple Chancery", "Brush Script MT", cursive;
  --font-ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s: 1;
  color-scheme: dark;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  background: radial-gradient(circle at 50% 38%, var(--night-0) 0%, var(--night-1) 40%, var(--night-2) 100%);
  color: var(--ink-soft);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  cursor: default;
}
#bg, #fx {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; pointer-events: none;
}
#bg { z-index: 0; }
.spot {
  position: fixed; z-index: 1; left: 50%; top: 0;
  transform: translateX(-50%);
  pointer-events: none;
  background: linear-gradient(to bottom,
      rgba(255, 238, 210, 0.00) 0%,
      rgba(255, 236, 206, 0.055) 35%,
      rgba(255, 230, 196, 0.11) 100%);
  clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
  filter: blur(26px);
}
.table {
  position: fixed; z-index: 1; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 55% at 50% 10%, rgba(255, 226, 186, 0.08), transparent 70%),
    repeating-linear-gradient(to bottom, rgba(255, 220, 180, 0.018) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.10) 0 9px, transparent 9px 23px),
    linear-gradient(to bottom, #1b120c 0%, #120b07 35%, #070403 100%);
  box-shadow: inset 0 1px 0 rgba(255, 214, 170, 0.10), inset 0 18px 30px rgba(0, 0, 0, 0.45);
}
.table::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 75% 120% at 50% 0%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
}
#scene, #textLayer {
  position: fixed; left: 50%;
  transform: translateX(-50%);
}
#scene { z-index: 2; pointer-events: none; }
#cake { width: 100%; height: 100%; display: block; overflow: visible; }
.warm {
  position: fixed; z-index: 3; pointer-events: none;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 150, 60, 0.22), rgba(255, 120, 40, 0.08) 55%, transparent 100%);
  mix-blend-mode: screen;
  opacity: 0;
}
#fx { z-index: 5; }
.vignette {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
}
.dim {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: #000; opacity: 0;
  transition: opacity 1.6s ease;
}
#textLayer { z-index: 7; pointer-events: none; }
.title, .wish {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  text-align: center;
  font-family: var(--font-script);
  color: var(--gold);
  line-height: 1.15;
}
.title {
  top: calc(var(--s) * 128px);
  font-size: calc(var(--s) * 68px);
  text-shadow: 0 0 calc(var(--s) * 10px) var(--gold-glow), 0 0 calc(var(--s) * 28px) rgba(255, 170, 80, 0.30);
}
.title.shimmer { animation: shimmer 4.5s ease-in-out infinite; }
.title span {
  display: inline-block;
  opacity: 0;
  white-space: pre;
}
.title span.in { animation: letterIn 0.7s cubic-bezier(.2, .7, .2, 1) forwards; }
.wish {
  top: calc(var(--s) * 214px);
  font-size: calc(var(--s) * 40px);
  opacity: 0;
  filter: blur(6px);
  transition: opacity 2s ease, filter 2s ease;
  text-shadow: 0 0 calc(var(--s) * 12px) rgba(255, 210, 140, 0.45);
}
.wish.show { opacity: 1; filter: blur(0); }
@keyframes letterIn {
  0%   { opacity: 0; transform: translateY(0.18em) scale(0.9); filter: blur(8px); }
  60%  { opacity: 1; filter: blur(0.5px); }
  100% { opacity: 1; transform: none; filter: blur(0); }
}
@keyframes shimmer {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.18); }
}
.ui {
  position: fixed; z-index: 9;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 500 12px/1 var(--font-ui);
  letter-spacing: 0.04em;
  color: rgba(240, 232, 220, 0.75);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 999px;
  padding: 8px 14px;
  opacity: 0.5;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: opacity .25s ease, box-shadow .25s ease, color .25s ease;
}
.ui:hover, .ui:focus-visible {
  opacity: 0.95; color: #fff;
  box-shadow: 0 0 18px rgba(255, 210, 150, 0.18);
}
.ui:focus-visible { outline: 1px solid rgba(255, 220, 170, 0.6); outline-offset: 2px; }
#replay { right: 16px; }
#sound { left: 16px; }
.hint {
  position: fixed; z-index: 8; left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font: 400 12px/1.3 var(--font-ui);
  letter-spacing: 0.06em;
  color: rgba(240, 228, 210, 0.55);
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
  white-space: nowrap;
}
.hint.show { opacity: 1; }
@media (max-width: 520px) {
  .hint { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
}
[hidden] { display: none !important; }

/* ---------- The birthday gift (opens after the wish) ---------- */
.gift {
  position: fixed; z-index: 4; left: 0; top: 0;
  width: var(--gs, 200px); height: var(--gs, 200px);
  visibility: hidden;
  pointer-events: none;
}
.gift.on { visibility: visible; }
.gift-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.gift-btn {
  position: absolute; margin: 0; padding: 0; border: 0;
  background: transparent; border-radius: 8px;
  cursor: pointer; pointer-events: auto;
}
.gift-btn:focus-visible { outline: 2px solid rgba(255, 220, 160, .8); outline-offset: 4px; }
.gift.open .gift-btn { display: none; }
#giftRays, #giftBow, .rays-sway { transform-box: fill-box; }
#giftRays, .rays-sway { transform-origin: 50% 100%; }
#giftBow { transform-origin: 50% 70%; }
.gift.open .rays-sway { animation: raysSway 7s ease-in-out infinite; }
@keyframes raysSway {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

/* ---------- The letter: falls beside the gift, tap to open ---------- */
.env {
  position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; cursor: pointer;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 5px 9px rgba(0, 0, 0, .38)) drop-shadow(0 0 8px rgba(255, 200, 120, .55));
}
.env.ready { pointer-events: auto; }
.env-body {
  position: absolute; inset: 0; border-radius: 3px;
  background: linear-gradient(160deg, #fffaf0, #efe0bf);
  box-shadow: inset 0 0 0 1px rgba(150, 105, 50, .55);
}
.env-paper {
  position: absolute; left: 9%; right: 9%; top: 16%; bottom: 12%; border-radius: 2px;
  background: #fffdf6; box-shadow: inset 0 0 0 1px rgba(150, 105, 50, .25);
  transition: transform .9s cubic-bezier(.2, .8, .2, 1) .35s;
}
.env.open .env-paper { transform: translateY(-62%); }
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 60%;
  background: linear-gradient(170deg, #fbf1dc, #e6d2a6);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: 50% 0;
  transition: transform .7s ease, opacity .7s ease .1s;
}
.env.open .env-flap { transform: rotateX(180deg); opacity: 0; }
.env-seal {
  position: absolute; left: 50%; top: 56%; width: 26%; height: 26%;
  margin: -13% 0 0 -13%; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe2a0, #b8862e);
  box-shadow: 0 0 0 1px rgba(90, 50, 20, .45);
  transition: opacity .3s ease;
}
.env.open .env-seal { opacity: 0; }
.env-tip {
  position: absolute; left: 50%; top: 100%; margin-top: 8px; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; opacity: 0;
  font: 600 11px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); text-shadow: 0 0 8px rgba(255, 190, 110, .6);
  transition: opacity .6s ease .4s;
}
.env.ready .env-tip { opacity: .9; }
.env.open .env-tip { opacity: 0; transition-delay: 0s; }

/* while a letter is open the title and wish step aside, and come back when it closes */
#textLayer { transition: opacity .6s ease; }
body.reading #textLayer { opacity: 0; }

/* the letter overlay: dims the scene so nothing behind it competes with the text */
.letter {
  position: fixed; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(6, 5, 10, .62);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .6s ease, visibility 0s linear .6s;
}
.letter.on {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .6s ease, visibility 0s;
}
.letter-card {
  position: relative; width: min(360px, 88vw); max-height: 74vh; overflow: auto;
  padding: 30px 26px 24px; border-radius: 10px;
  background: linear-gradient(170deg, #fffaf0, #f2e4c6); color: #4a3424;
  box-shadow: 0 26px 60px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(150, 105, 50, .35);
  font-family: var(--font-script); font-size: 23px; line-height: 1.4;
  opacity: 0; transform: translateY(18px) scale(.92);
  transition: opacity .5s ease, transform .7s cubic-bezier(.2, .8, .2, 1);
}
.letter.on .letter-card { opacity: 1; transform: none; transition-delay: .15s; }
.letter-card p { margin: 0 0 .5em; }
.letter-card p.gap { height: .6em; margin: 0; }
.letter-close {
  position: absolute; right: 8px; top: 4px; border: 0; background: transparent;
  font-size: 24px; line-height: 1; color: #8a5a2b; cursor: pointer; padding: 6px;
}
.letter-close:focus-visible { outline: 2px solid #b8862e; outline-offset: 2px; }

/* ---------- The big party portrait ---------- */
.party {
  position: fixed; z-index: 4; left: 0; top: 0;
  width: var(--pw, 300px); height: calc(var(--pw, 300px) * 1.25);
  perspective: 1400px;
  visibility: hidden;
  pointer-events: none;
  --warm: 0;
}
.party.on { visibility: visible; }
.pp-beam {
  position: absolute; left: 50%; bottom: 35%;
  width: 280%; height: var(--beamh, 600px);
  transform: translateX(-50%);
  background: linear-gradient(to bottom, rgba(255, 238, 210, 0) 0%, rgba(255, 232, 200, .07) 45%, rgba(255, 226, 190, .17) 100%);
  clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
  filter: blur(18px);
  opacity: 0;
}
.party.top .pp-beam { display: none; }
.pp-glow {
  position: absolute; inset: -22%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 214, 160, .17), rgba(255, 180, 110, .06) 55%, rgba(255, 170, 100, 0) 100%);
  opacity: 0;
}
.pp-stand { position: absolute; inset: 0; transform-style: preserve-3d; opacity: 0; }
.party.side .pp-stand { transform: rotateY(-13deg) rotateZ(-2.5deg); transform-origin: 50% 100%; }
.party.top .pp-stand { transform: rotateZ(-3deg); transform-origin: 50% 0; }
.pp-easel, .pp-ledge { position: absolute; }
.pp-easel { overflow: visible; }
.pp-ledge {
  left: -6%; right: -6%;
  bottom: calc(var(--pw) * -.04); height: calc(var(--pw) * .045);
  border-radius: 2px;
  background: linear-gradient(to bottom, #8a5c34, #5b3920 55%, #3a2413);
  box-shadow: 0 calc(var(--pw) * .02) calc(var(--pw) * .04) rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 214, 170, .35);
}
.pp-hanger, .pp-pin { display: none; }
.party.top .pp-hanger, .party.top .pp-pin { display: block; }
.party.top .pp-easel, .party.top .pp-ledge { display: none; }
.pp-hanger { position: absolute; left: 0; bottom: 100%; width: 100%; height: var(--rh, 22px); overflow: visible; }
.pp-pin {
  position: absolute; left: 50%; top: calc(var(--rh, 22px) * -1 - 6px);
  width: 12px; height: 12px; margin-left: -6px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff6d6, #e2b866 45%, #7a5a20 100%);
  box-shadow: 0 0 10px rgba(255, 210, 140, .6);
}
.pp-frame {
  position: absolute; inset: 0;
  border-radius: 3px;
  background: linear-gradient(135deg, #4a3410 0%, #c99a48 12%, #f7e1a1 22%, #a9792c 36%, #fff0c4 49%, #b0832f 62%, #f3d38d 77%, #7a5a20 90%, #4a3410 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 244, 210, .75),
    inset 0 0 0 calc(var(--pw) * .018) rgba(120, 86, 30, .35),
    0 calc(var(--pw) * .06) calc(var(--pw) * .14) rgba(0, 0, 0, .6),
    0 0 calc(var(--pw) * .2) rgba(255, 196, 110, calc(.08 + var(--warm) * .25));
}
.pp-frame::before {
  content: ""; position: absolute; inset: calc(var(--pw) * .028);
  border: 1px solid rgba(90, 60, 18, .55);
  box-shadow: 0 0 0 1px rgba(255, 238, 196, .45);
  border-radius: 2px; pointer-events: none;
}
.pp-mat {
  position: absolute; inset: calc(var(--pw) * .065);
  background: linear-gradient(160deg, #fbf6ec, #e8ddc7);
  box-shadow: inset 0 calc(var(--pw) * .01) calc(var(--pw) * .03) rgba(0, 0, 0, .5);
}
.pp-pic {
  position: absolute;
  top: calc(var(--pw) * .045); left: calc(var(--pw) * .045); right: calc(var(--pw) * .045); bottom: calc(var(--pw) * .115);
  display: block; margin: 0; padding: 0; border: 0;
  overflow: hidden;
  background: #1c1520;
  color: inherit; font: inherit;
  box-shadow: 0 0 0 1px rgba(150, 115, 60, .6);
  pointer-events: none;
}
.party.revealed .pp-pic { pointer-events: auto; cursor: pointer; }
.party.revealed .pp-pic:hover { filter: brightness(1.08); }
.pp-pic:focus-visible { outline: 2px solid rgba(255, 220, 160, .9); outline-offset: 3px; }
.pp-pic img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  object-fit: cover; object-position: 50% 30%;
}
.pp-pic::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 calc(var(--pw) * .06) rgba(0, 0, 0, .45);
}
.pp-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--pw) * .025);
  background: radial-gradient(ellipse at 50% 38%, #3f2c47, #1a121f 75%);
  text-align: center;
}
.pp-empty svg { width: 30%; height: auto; }
.pp-empty b { font: 400 calc(var(--pw) * .11)/1 var(--font-script); color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
.pp-empty small { font: 500 calc(var(--pw) * .036)/1.3 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: rgba(240, 228, 210, .6); }
.pp-flash {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, #fffaf0, rgba(255, 240, 210, .6) 60%, rgba(255, 230, 200, .2));
  opacity: 0;
}
.pp-glare {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(118deg, rgba(255, 255, 255, .08) 0%, rgba(255, 255, 255, 0) 30%),
    linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .38) 50%, transparent 58%);
  background-size: 100% 100%, 300% 100%;
  background-position: 0 0, 100% 0;
  background-repeat: no-repeat;
  mix-blend-mode: screen;
}
.pp-plaque {
  position: absolute; left: 50%; bottom: calc(var(--pw) * .022);
  transform: translateX(-50%);
  max-width: 76%;
  padding: calc(var(--pw) * .01) calc(var(--pw) * .055) calc(var(--pw) * .014);
  border-radius: 2px;
  background: linear-gradient(135deg, #7a5a20, #e9c97e 30%, #fff0c4 50%, #c99a48 72%, #7a5a20);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 244, 210, .55);
  font: 400 calc(var(--pw) * .06)/1.1 var(--font-script);
  color: #4a3410;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pp-warm {
  position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
  background: radial-gradient(ellipse 95% 75% at 0% 72%, rgba(255, 160, 70, .4), rgba(255, 160, 70, 0) 70%);
  mix-blend-mode: screen;
  opacity: var(--warm);
}
.party.top .pp-warm { background: radial-gradient(ellipse 90% 70% at 50% 120%, rgba(255, 160, 70, .38), rgba(255, 160, 70, 0) 70%); }
.pp-lights { position: absolute; left: 0; overflow: visible; pointer-events: none; }
.pp-bulb { opacity: 0; }
.pp-bulb .g { animation: ppTw var(--d, 2.4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes ppTw {
  0%, 100% { opacity: .5; }
  50% { opacity: 1; }
}
.pp-cloth { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

/* ---------- Front page: the dart game ---------- */
.dart-page {
  position: fixed; inset: 0; z-index: 4;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(8px, 2vh, 20px);
  padding: calc(3.5vh + min(8.5vh, 70px) + 12px) 16px calc(64px + env(safe-area-inset-bottom, 0px));
  cursor: crosshair;
  touch-action: manipulation;
  --bd: min(84vw, 44vh, 440px);
}
.dart-page.gone { display: none; }
.dp-head { display: grid; justify-items: center; gap: 6px; text-align: center; }
.dp-title {
  margin: 0;
  font: 400 clamp(34px, 6.4vh, 66px)/1 var(--font-script);
  color: var(--gold);
  text-shadow: 0 0 10px var(--gold-glow), 0 0 28px rgba(255, 170, 80, .3);
}
.dp-sub {
  margin: 0; max-width: 36ch;
  font: 500 clamp(13px, 1.8vh, 16px)/1.4 var(--font-ui);
  letter-spacing: .02em;
  color: rgba(240, 228, 210, .72);
  text-wrap: balance;
}
.dp-board-wrap {
  position: relative; flex: none;
  width: var(--bd); height: var(--bd); max-width: 100%;
  filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .65));
  transform-origin: 50% 50%;
}
.dp-board { display: block; width: 100%; height: 100%; overflow: visible; outline: none; }
.dp-board:focus-visible { outline: 2px solid rgba(255, 220, 160, .7); outline-offset: 8px; border-radius: 50%; }
.dp-pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: dpPulse 1.8s ease-out infinite; }
@keyframes dpPulse {
  0% { transform: scale(.6); opacity: .9; }
  100% { transform: scale(2.4); opacity: 0; }
}
.dp-bull-text {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0);
  font: 400 calc(var(--bd) * .19)/1 var(--font-script);
  color: #fff3cf;
  text-shadow: 0 0 18px rgba(255, 200, 110, .95), 0 0 46px rgba(255, 160, 70, .65), 0 4px 10px rgba(0, 0, 0, .6);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
}
.dp-info { display: grid; justify-items: center; gap: clamp(8px, 1.6vh, 14px); width: 100%; }
.dp-msg {
  box-sizing: border-box;
  max-width: min(520px, 100%);
  padding: 10px 18px;
  border-radius: 14px;
  background: rgba(16, 12, 22, .55);
  border: 1px solid rgba(243, 211, 141, .22);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  font: 600 clamp(19px, 2.7vh, 25px)/1.25 var(--font-hand);
  color: #f6ead6;
  text-align: center; text-wrap: balance;
}
.dp-darts { display: flex; gap: 10px; align-items: center; }
.dp-darts svg { width: 26px; height: 26px; transition: opacity .45s ease, transform .45s ease; }
.dp-darts svg.used { opacity: .16; transform: translateY(5px) rotate(14deg); }
@media (orientation: landscape) and (max-height: 560px) {
  .dart-page {
    display: grid;
    grid-template-columns: auto minmax(0, 340px);
    grid-template-areas: "board head" "board info";
    align-content: center; justify-content: center;
    column-gap: 28px; row-gap: 12px;
    padding-top: calc(3.5vh + min(8.5vh, 70px));
    --bd: min(62vh, 44vw);
  }
  .dp-board-wrap { grid-area: board; }

// Cream spiral piped onto a round surface. The bag tip follows the path.
async function pipeSpiral({ cy, rx, ry, cream, parent, onProgress }) {
  const pts = [];
  const turns = 2.4, N = 140;
  for (let i = 0; i <= N; i++) {
    const f = i / N, r = 0.06 + 0.84 * f, th = -Math.PI / 2 + f * turns * Math.PI * 2;
    pts.push(`${(CX + rx * r * Math.cos(th)).toFixed(1)},${(cy + ry * r * Math.sin(th)).toFixed(1)}`);
  }
  const d = 'M' + pts.join(' L');
  const g = el('g', {}, parent);
  const path = el('path', { d, fill: 'none', stroke: cream, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const hi = el('path', { d, fill: 'none', stroke: '#ffffff', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .55, transform: 'translate(-1,-2)' }, g);
  const len = path.getTotalLength();
  for (const p of [path, hi]) { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; }
  const bag = makePipingBag(cream);
  const p0 = path.getPointAtLength(0);
  bag.set({ x: p0.x + 160, y: p0.y - 220, r: 22, o: 0 });
  await bag.to({ x: p0.x, y: p0.y - 1, r: 18, o: 1 }, 700, ease.out);
  bag.squeeze(true); sfx('pipe');
  await tween(1700, e => {
    const l = len * e;
    path.style.strokeDashoffset = len - l;
    hi.style.strokeDashoffset = len - l;
    const p = path.getPointAtLength(l);
    bag.set({ x: p.x, y: p.y - 1, r: 18 + 6 * Math.sin(e * 9) });
    if (onProgress) onProgress(e);
  }, ease.inOut);
  bag.squeeze(false);
  await bag.to({ x: CX + rx + 120, y: cy - 200, r: 30, o: 0 }, 600, ease.in);
  bag.remove();
  return g;
}

// Frosting: palette knife spreads buttercream around the side, then across the top.
async function frostTier({ yTop, yBot, rx, ry, side, top, parent, label }) {
  const g = el('g', {}, parent);
  const d = sidePath(CX, yTop, yBot, rx, ry);
  // side, revealed by a sweeping clip
  const cs = uid('fc'), cpS = el('clipPath', { id: cs }, dyn);
  const rS = el('rect', { x: CX - rx - 2, y: yTop - ry - 6, width: 0, height: yBot - yTop + 2 * ry + 12 }, cpS);
  const sideG = el('g', { 'clip-path': `url(#${cs})` }, g);
  el('path', { d, fill: side }, sideG);
  const marks = el('g', { 'clip-path': clipFor(d), opacity: .5 }, sideG);
  for (let i = 0; i < 6; i++) {
    const yy = yTop + (yBot - yTop) * (i + .5) / 6;
    el('path', { d: `M${CX - rx},${yy} A${rx},${ry} 0 0 0 ${CX + rx},${yy}`, fill: 'none', stroke: '#fff', 'stroke-width': .7, opacity: rand(.1, .3) }, marks);
  }
  el('path', { d, fill: P.shadeV }, sideG);
  // top, revealed by a second sweep
  const ct = uid('ft'), cpT = el('clipPath', { id: ct }, dyn);
  const rT = el('rect', { x: CX - rx - 2, y: yTop - ry - 4, width: 0, height: ry * 2 + 8 }, cpT);
  const topG = el('g', { 'clip-path': `url(#${ct})` }, g);
  el('ellipse', { cx: CX, cy: yTop, rx, ry, fill: top }, topG);
  el('path', { d: `M${CX - rx * .86},${yTop - ry * .2} A${rx * .9},${ry * .8} 0 0 1 ${CX + rx * .2},${yTop - ry * .82}`, fill: 'none', stroke: '#fff', 'stroke-width': 1.6, opacity: .45, 'stroke-linecap': 'round' }, topG);
  // gloss band
  const glossG = el('g', { 'clip-path': clipFor(d), opacity: 0 }, g);
  const gloss = el('rect', { x: CX - rx * .62, y: yTop - ry, width: rx * .26, height: yBot - yTop + ry * 2, fill: P.gloss }, glossG);
  el('rect', { x: CX + rx * .55, y: yTop - ry, width: rx * .1, height: yBot - yTop + ry * 2, fill: P.gloss, opacity: .5 }, glossG);

  const sp = makeSpatula();
  const frontY = x => yBot + ry * Math.sqrt(Math.max(0, 1 - ((x - CX) / rx) ** 2));
  const x0 = CX - rx;
  sp.set({ x: x0 - 140, y: frontY(x0) - 40, r: -25, o: 0 });
  await sp.to({ x: x0 + 4, y: frontY(x0 + 4) - 1, r: 6, o: 1 }, 600, ease.out);
  sfx('slide');
  await tween(1500, e => {
    const x = x0 + 4 + (rx * 2 - 8) * e;
    rS.setAttribute('width', x - (CX - rx - 2) + 4);
    sp.set({ x, y: frontY(x) - 1, r: 6 - 12 * e + 3 * Math.sin(e * 12) });
  }, ease.inOut);
  rS.setAttribute('width', rx * 2 + 4);
  // top pass: knife lies nearly flat
  await sp.to({ x: CX - rx + 6, y: yTop + 2, r: -84 }, 450, ease.inOut);
  sfx('slide');
  await tween(900, e => {
    const x = CX - rx + 6 + (rx * 2 + 6) * e;
    rT.setAttribute('width', x - (CX - rx - 2) + 10);
    sp.set({ x, y: yTop + 2 - 4 * Math.sin(e * Math.PI), r: -84 + 4 * Math.sin(e * 8) });
  }, ease.inOut);
  rT.setAttribute('width', rx * 2 + 4);
  // final finishing pass + gloss
  fadeIn(glossG, 700).catch(noop);
  await sp.to({ x: CX + rx - 30, y: yTop - 6, r: -88 }, 300);
  await sp.to({ x: CX + rx + 160, y: yTop - 120, r: -60, o: 0 }, 550, ease.in);
  sp.remove();
  return { g, gloss: glossG };
}

// Glossy drip: pour stream, puddle spreads, rim band then individual drips of varied length.
async function dripTier({ yTop, rx, ry, topFill, sideFill, pourFill, parent, n, minL, maxL, highlight }) {
  const g = el('g', {}, parent);
  // stream
  const stream = el('rect', { x: CX - 4.5, y: yTop - 330, width: 9, height: 330, rx: 4.5, fill: pourFill }, L.fx);
  await anim(stream, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 380, easing: 'cubic-bezier(.5,0,.9,.5)' }, CX, yTop - 330);
  sfx('pipe');
  // puddle
  const puddle = el('ellipse', { cx: CX, cy: yTop, rx: rx * .985, ry: ry * .985, fill: topFill }, g);
  const hl = el('path', { d: `M${CX - rx * .75},${yTop - ry * .25} A${rx * .8},${ry * .75} 0 0 1 ${CX + rx * .1},${yTop - ry * .8}`, fill: 'none', stroke: highlight, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0 }, g);
  await tween(800, e => {
    const k = 0.08 + 0.92 * e;
    puddle.setAttribute('transform', `translate(${CX},${yTop}) scale(${k}) translate(${-CX},${-yTop})`);
  }, ease.out);
  puddle.removeAttribute('transform');
  anim(stream, [{ transform: 'scaleY(1)', opacity: 1 }, { transform: 'scaleY(0)', opacity: .6 }], { duration: 300, easing: 'ease-in' }, CX, yTop).then(() => stream.remove(), () => stream.remove());
  // rim band along the front edge with a soft wavy lower edge
  const N = 64, upper = [], lower = [];
  for (let i = 0; i <= N; i++) {
    const t = Math.PI * i / N, x = CX + rx * Math.cos(t), y = yTop + ry * Math.sin(t);
    upper.push(`${x.toFixed(1)},${(y - .5).toFixed(1)}`);
    lower.unshift(`${x.toFixed(1)},${(y + 5 + 1.6 * Math.sin(i * 1.7)).toFixed(1)}`);
  }
  const band = el('path', { d: `M${upper.join(' L')} L${lower.join(' L')}Z`, fill: sideFill, opacity: 0 }, g);
  g.appendChild(puddle); g.appendChild(hl);
  await fadeIn(band, 250);
  // drips
  const drips = [];
  for (let i = 0; i < n; i++) {
    const t = Math.PI * (0.05 + 0.9 * (i + rand(.2, .8)) / n);
    const x = CX + rx * Math.cos(t), y = yTop + ry * Math.sin(t) + 3;
    const w = (7 + rand(0, 5)) * Math.pow(Math.sin(t), .5);
    const roll = Math.random();
    const Lh = roll < .3 ? rand(minL * .5, minL) : roll < .75 ? rand(minL, (minL + maxL) / 2) : rand((minL + maxL) / 2, maxL);
    const outer = el('g', { transform: `translate(${x.toFixed(1)},${y.toFixed(1)}) skewX(${rand(-4, 4).toFixed(1)})` }, g);
    const dg = el('g', {}, outer);
    el('path', { d: `M${-w / 2},0 L${-w / 2 * .9},${Lh} C${-w * .62},${Lh + w * .95} ${w * .62},${Lh + w * .95} ${w / 2 * .9},${Lh} L${w / 2},0 Z`, fill: sideFill }, dg);
    el('path', { d: `M${-w * .22},1 L${-w * .2},${Lh}`, stroke: highlight, 'stroke-width': Math.max(.8, w * .14), 'stroke-linecap': 'round', opacity: .55 }, dg);
    dg.style.transformBox = 'fill-box'; dg.style.transformOrigin = '50% 0';
    dg.style.transform = 'scaleY(0)';
    drips.push(dg);
  }
  await Promise.all(drips.map((dg, i) => {
    const my = RUN;
    return dg.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(.7)', offset: .5 }, { transform: 'scaleY(1)' }],
      { duration: T(rand(900, 1500)), delay: T(rand(0, 450)), easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' })
      .finished.then(() => { if (my !== RUN) throw CANCEL; }, () => { throw CANCEL; });
  }));
  await anim(hl, [{ opacity: 0 }, { opacity: .7 }], { duration: 500 });
  return g;
}

function createCandle(x, yBase, color, h = 46, w = 7) {
  const g = el('g', {}, null);
  el('ellipse', { cx: x + 2, cy: yBase + 1, rx: 5.5, ry: 1.8, fill: '#000', opacity: .3 }, g);
  const id = uid('cc'), cp = el('clipPath', { id }, dyn);
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, rx: 1.6 }, cp);
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, rx: 1.6, fill: color }, g);
  const st = el('g', { 'clip-path': `url(#${id})` }, g);
  for (let k = -1; k < h / 6 + 1; k++) {
    const yy = yBase - h + k * 6.5;
    el('line', { x1: x - w / 2 - 1, y1: yy + 4, x2: x + w / 2 + 1, y2: yy - 1, stroke: '#fff', 'stroke-width': 1.6, opacity: .55 }, st);
  }
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, fill: P.candleShade }, st);
  el('ellipse', { cx: x, cy: yBase - h, rx: w / 2, ry: 1.2, fill: '#ffffff', opacity: .55 }, g);
  el('path', { d: `M${x},${yBase - h} Q${x + .9},${yBase - h - 3} ${x + .3},${yBase - h - 5.5}`, stroke: '#2a2018', 'stroke-width': 1.2, fill: 'none', 'stroke-linecap': 'round' }, g);
  return { g, x, yBase, top: yBase - h - 5.5 };
}

function createFlame(parent, x, y) {
  const g = el('g', { transform: `translate(${x},${y})` }, parent);
  const glow = el('circle', { cx: 0, cy: -9, r: 30, fill: P.flameGlow, opacity: 0 }, g);
  const f = el('g', { transform: 'scale(0)' }, g);
  el('path', { d: 'M0,0 C-5.5,-1 -6.5,-9 -3.5,-15 C-2,-19 -.5,-22 0,-27 C1.5,-21 5,-17 5.5,-11 C6.5,-4 4,0 0,0Z', fill: P.flameOuter }, f);
  el('path', { d: 'M0,-1 C-3,-1.5 -3.6,-6 -2,-10 C-1,-13 0,-15 0,-18 C1,-14 3.2,-11 3.2,-7 C3.4,-3 2,-1 0,-1Z', fill: P.flameInner }, f);
  el('ellipse', { cx: 0, cy: -2.6, rx: 2.6, ry: 3.3, fill: P.flameBlue }, f);
  el('ellipse', { cx: 0, cy: -6.5, rx: 1.1, ry: 2.6, fill: '#fff', opacity: .85 }, f);
  const fl = { g, f, glow, x, y, level: 0, ph: [rand(0, 9), rand(0, 9), rand(0, 9), rand(0, 9)], sp: rand(.85, 1.25) };
  flames.push(fl);
  return fl;
}

let warmLevel = 0;
function flickerLoop(t) {
  const amp = RM ? .35 : 1;
  let sum = 0;
  for (const fl of flames) {
    const k = fl.level;
    sum += k;
    if (k <= 0.001) { fl.f.setAttribute('transform', 'scale(0)'); fl.glow.setAttribute('opacity', 0); continue; }
    const s = t * 0.001 * fl.sp, p = fl.ph;
    const n1 = Math.sin(s * 9.1 + p[0]) * .6 + Math.sin(s * 23.7 + p[1]) * .4;
    const n2 = Math.sin(s * 7.3 + p[2]) * .5 + Math.sin(s * 31.3 + p[3]) * .5;
    const n3 = Math.sin(s * 3.1 + p[1]) * .7 + Math.sin(s * 13.9 + p[2]) * .3;
    // breath from the microphone makes the flame lean, stretch and shiver
    const w = fl.out ? 0 : wind, gust = w * (0.75 + 0.25 * Math.sin(s * 40 + p[0]));
    const sx = k * (1 + .07 * n1 * amp + .12 * gust), sy = k * (1 + .13 * n2 * amp - .38 * gust), rot = 5 * n3 * amp + 32 * gust + 8 * gust * n1;
    fl.f.setAttribute('transform', `rotate(${rot.toFixed(2)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
    fl.glow.setAttribute('opacity', (k * (.78 + .22 * n2 * amp)).toFixed(3));
  }
  const target = flames.length ? sum / flames.length : 0;
  warmLevel += (target - warmLevel) * 0.08;
  const flick = 0.92 + 0.08 * Math.sin(t * 0.013) * Math.sin(t * 0.0071);
  if (S_.warmSvg) S_.warmSvg.setAttribute('opacity', (warmLevel * flick).toFixed(3));
  ui.warm.style.opacity = (warmLevel * flick).toFixed(3);
  PT.el.style.setProperty('--warm', (warmLevel * flick * 0.8).toFixed(3));
}

const particles = [];
function emitCelebration() {
  const n = RM ? 20 : SMALL ? 50 : 90;
  const cols = ['#f3d38d', '#ffe9b8', '#f7c6d0', '#c9e4f5', '#fbe7a8', '#d6c8f2'];
  for (let i = 0; i < n; i++) {
    particles.push({
      kind: Math.random() < .55 ? 'spark' : 'confetti',
      x: rand(0, VW), y: rand(-VH * .5, -10),
      vx: rand(-12, 12), vy: rand(22, 55), rot: rand(0, 6.28), vr: rand(-2, 2),
      size: rand(2, 5), c: cols[(Math.random() * cols.length) | 0], ph: rand(0, 6.28), life: 1, ambient: false
    });
  }
}
function seedAmbient() {
  const n = SMALL ? 10 : 20;
  for (let i = 0; i < n; i++) particles.push({ kind: 'mote', ambient: true, x: rand(0, VW), y: rand(0, VH), vx: rand(-4, 4), vy: rand(-8, -2), size: rand(.6, 1.6), ph: rand(0, 6.28), c: '#ffe2a8', life: 1 });
}
function drawFx(t, dt) {
  fctx.clearRect(0, 0, VW, VH);
  const step = Math.min(dt, 50) / 1000 * (RM ? .4 : 1);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind === 'rocket' || p.kind === 'ember' || p.kind === 'trail' || p.kind === 'flash') {
      if (drawFirework(p, step, t)) particles.splice(i, 1);
      continue;
    }
    p.x += (p.vx + Math.sin(t * .001 + p.ph) * 10) * step;
    p.y += p.vy * step;
    if (p.ambient) {
      if (p.y < -10) { p.y = VH + 10; p.x = rand(0, VW); }
      const a = .25 + .25 * Math.sin(t * .0015 + p.ph);
      fctx.fillStyle = `rgba(255,226,168,${a})`;
      fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 6.283); fctx.fill();
      continue;
    }
    if (p.y > VH * .92) p.life -= step * 1.5;
    if (p.life <= 0 || p.y > VH + 20) { particles.splice(i, 1); continue; }
    p.rot += p.vr * step;
    fctx.save();
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.kind === 'spark' ? .6 + .4 * Math.sin(t * .008 + p.ph) : .75);
    fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    if (p.kind === 'spark') {
      const s = p.size * 1.6;
      fctx.fillStyle = p.c;
      fctx.shadowColor = p.c; fctx.shadowBlur = 8;
      fctx.beginPath();
      fctx.moveTo(0, -s); fctx.lineTo(s * .22, -s * .22); fctx.lineTo(s, 0); fctx.lineTo(s * .22, s * .22);
      fctx.lineTo(0, s); fctx.lineTo(-s * .22, s * .22); fctx.lineTo(-s, 0); fctx.lineTo(-s * .22, -s * .22);
      fctx.closePath(); fctx.fill();
    } else {
      fctx.fillStyle = p.c;
      fctx.scale(1, Math.cos(t * .004 + p.ph));
      fctx.fillRect(-p.size, -p.size * .45, p.size * 2, p.size * .9);
    }
    fctx.restore();
  }
}

function smokeWisp(x, y, delay = 0) {

// ---------- Microphone: blow detection ----------
// Blowing into a mic gives a loud, noise-like (spectrally flat) signal.
// Speech and music are tonal, so flatness keeps them from blowing the candles out.
const Mic = {
  state: 'off', // off | pending | suspended | on | denied
  ctx: null, an: null, td: null, fd: null, floor: 0.01,
  async start() {
    // microphone disabled: candles are blown out by tapping or clicking
    this.state = 'denied'; updateHint(); return;
    if (this.state !== 'off') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.state = 'denied'; updateHint(); return; }
    this.state = 'pending'; updateHint();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const src = this.ctx.createMediaStreamSource(stream);
      this.an = this.ctx.createAnalyser();
      this.an.fftSize = 1024;
      this.an.smoothingTimeConstant = 0.3;
      src.connect(this.an);
      this.td = new Float32Array(this.an.fftSize);
      this.fd = new Uint8Array(this.an.frequencyBinCount);
      if (this.ctx.state === 'suspended') { try { await this.ctx.resume(); } catch (e) { /* needs a tap */ } }
      this.state = this.ctx.state === 'running' ? 'on' : 'suspended';
    } catch (e) {
      this.state = 'denied';
    }
    updateHint();
  },
  resume() {
    if (this.ctx && this.ctx.state !== 'running') {
      this.ctx.resume().then(() => { this.state = 'on'; updateHint(); }, noop);
    }
  },
  // Returns blow strength 0..1
  read() {
    if (this.state !== 'on') return 0;
    this.an.getFloatTimeDomainData(this.td);
    let s = 0;
    for (let i = 0; i < this.td.length; i++) s += this.td[i] * this.td[i];
    const rms = Math.sqrt(s / this.td.length);
    this.an.getByteFrequencyData(this.fd);
    let logSum = 0, sum = 0, n = 0;
    for (let i = 2; i < 180; i++) { const v = this.fd[i] + 1; logSum += Math.log(v); sum += v; n++; }
    const flat = Math.exp(logSum / n) / (sum / n); // 0 tonal .. 1 noise
    if (rms < this.floor * 2.5) this.floor += (rms - this.floor) * 0.02;
    const gate = Math.max(0.04, this.floor * 4);
    const excess = Math.max(0, rms - gate);
    const flatK = flat > 0.32 ? 1 : flat > 0.2 ? 0.45 : 0.1;
    return Math.min(1, excess * 9 * flatK);
  }
};

let wind = 0, blowAccum = 0;
function micTick(dt) {
  const active = state === 'COMPLETE' || state === 'BLOWING';
  const target = active ? Mic.read() : 0;
  wind += (target - wind) * (target > wind ? 0.35 : 0.08);
  if (!active) { wind *= 0.9; return; }
  if (wind > 0.22) {
    if (state === 'COMPLETE') { state = 'BLOWING'; ui.hint.classList.remove('show'); }
    blowAccum += dt * wind;
    // roughly half a second of steady blowing per candle; a strong blow is faster
    while (blowAccum > 260) {
      blowAccum -= 260;
      const lit = flames.filter(f => !f.out);
      if (!lit.length) break;
      // the candle nearest the centre of the breath goes first, then outward
      lit.sort((a, b) => Math.abs(a.x - CX) - Math.abs(b.x - CX));
      extinguish(lit[0]);
    }
  } else {
    blowAccum = Math.max(0, blowAccum - dt * 0.15);
  }
}

function extinguish(fl) {
  if (fl.out) return;
  fl.out = true;
  sfx('blow');
  const from = fl.level;
  tween(420, e => { fl.level = from * (1 - e); }, ease.in)
    .then(() => { fl.level = 0; smokeWisp(fl.x, fl.y - 2); }, noop);
  if (flames.every(f => f.out)) afterBlow().catch(noop);
}

async function afterBlow() {
  if (state === 'WISHED' || state === 'WISHING') return;
  state = 'WISHING';
  ui.hint.classList.remove('show');
  await wait(900);
  ui.dim.style.opacity = '0.28';
  await wait(1300);
  ui.wish.classList.add('show');
  sfx('chime');
  state = 'WISHED';
  await wait(700);
  await deliverGift();
  await wait(450);
  await openGift();
  fireworksShow().catch(noop);
}

// Tap / Space: used only when the microphone is not available.
async function blowOut() {
  if (state !== 'COMPLETE') return;
  state = 'BLOWING';
  ui.hint.classList.remove('show');
  for (const fl of [...flames]) {
    extinguish(fl);
    await wait(170);

}

// ---------- Fireworks on both sides of the title ----------
const FW_COLS = [
  ['#ffd98a', '#fff3cf', '#ffb24a'],
  ['#ff9ec0', '#ffe0ec', '#ff6f9e'],
  ['#9fc9ff', '#e2f0ff', '#6fa2ff'],
  ['#c9a8ff', '#efe4ff', '#a37bff'],
  ['#a8f0c8', '#e6fff0', '#5fd69a']

function launchRocket(side) {
  const r = ui.title.getBoundingClientRect();
  const cy = r.height ? r.top + r.height / 2 : VH * 0.25;
  const room = side < 0 ? r.left : VW - r.right;
  const off = room > 90 ? rand(40, Math.min(190, room - 20)) : rand(-30, 20);
  let tx = side < 0 ? r.left - off : r.right + off;
  tx = Math.max(24, Math.min(VW - 24, tx));
  let ty = Math.max(40, cy + rand(-80, 30));
  let sx = tx + side * rand(20, 70);
  let sy = VH * rand(0.86, 0.98);
  let dur = rand(1.0, 1.35);
  if (side > 0 && PT.revealed && PT.mode === 'side') {
    // rises from behind the portrait and bursts above it
    tx = PT.cx + rand(-0.4, 0.4) * PT.W;
    ty = Math.max(36, PT.top - rand(30, 100));
    sx = tx + rand(-14, 14); sy = PT.top + 6; dur = rand(0.6, 0.85);
  } else if (side > 0 && GF.opened) {
    // launched out of the open gift box
    sx = GF.left + GF.O.x + rand(-6, 6); sy = GF.top + GF.O.y;
  }
  particles.push({ kind: 'rocket', x: sx, y: sy, sx, sy, tx, ty, p: 0, dur, pal: FW_COLS[(Math.random() * FW_COLS.length) | 0], life: 1 });
  sfx('whoosh');
}
function explode(x, y, pal) {
  const n = RM ? 24 : SMALL ? 46 : 72;
  const ring = Math.random() < 0.35;
  const sp = Math.max(0.65, Math.min(1.3, S));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.06, 0.06);
    const v = (ring ? rand(150, 170) : rand(50, 190)) * sp;
    particles.push({ kind: 'ember', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(0.45, 0.8), c: pal[(Math.random() * pal.length) | 0], size: rand(1.2, 2.3), tw: Math.random() < 0.4, ph: rand(0, 6.28) });
  }
  particles.push({ kind: 'flash', x, y, life: 1, r: 70 * sp, c: pal[0] });
  sfx('boom');
}
// returns true when the particle is finished
function drawFirework(p, step, t) {
  const c = fctx;
  c.save();
  c.globalCompositeOperation = 'lighter';
  if (p.kind === 'rocket') {
    p.p = Math.min(1, p.p + step / p.dur);
    const e = 1 - Math.pow(1 - p.p, 2.2);
    const px = p.x, py = p.y;
    p.x = p.sx + (p.tx - p.sx) * e + Math.sin(p.p * 18) * 1.2;
    p.y = p.sy + (p.ty - p.sy) * e;
    for (let k = 0; k < 2; k++) particles.push({ kind: 'trail', x: p.x + rand(-1, 1), y: p.y + rand(0, 3), vx: rand(-8, 8), vy: rand(10, 40), life: 1, decay: rand(1.6, 2.6), c: p.pal[1], size: rand(.8, 1.6) });
    c.strokeStyle = p.pal[1]; c.globalAlpha = .8; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(px, py); c.lineTo(p.x, p.y); c.stroke();
    const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7);
    g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(1, 'rgba(255,220,160,0)');
    c.globalAlpha = 1; c.fillStyle = g;
    c.beginPath(); c.arc(p.x, p.y, 7, 0, 6.283); c.fill();
    c.restore();
    if (p.p >= 1) { explode(p.x, p.y, p.pal); return true; }
    return false;
  }
  if (p.kind === 'flash') {
    p.life -= step * 4;
    if (p.life <= 0) { c.restore(); return true; }
    const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(255,250,235,${0.55 * p.life})`);
    g.addColorStop(1, 'rgba(255,220,180,0)');
    c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
    c.restore();
    return false;
  }
  // ember / trail
  const drag = Math.pow(p.kind === 'ember' ? 0.25 : 0.4, step);
  p.vx *= drag; p.vy = p.vy * drag + (p.kind === 'ember' ? 70 : 20) * step;
  p.x += p.vx * step; p.y += p.vy * step;
  p.life -= step * p.decay;
  if (p.life <= 0) { c.restore(); return true; }
  let a = Math.min(1, p.life * 1.4);
  if (p.tw) a *= 0.55 + 0.45 * Math.sin(t * 0.03 + p.ph);
  c.globalAlpha = a;
  c.fillStyle = p.c;
  if (p.kind === 'ember') {
    c.strokeStyle = p.c; c.lineWidth = p.size * .8; c.globalAlpha = a * .45;
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); c.stroke();
    c.globalAlpha = a;
  }
  c.beginPath(); c.arc(p.x, p.y, p.size * (0.6 + 0.4 * p.life), 0, 6.283); c.fill();
  c.restore();
  return false;
}
async function fireworksShow() {
  const my = RUN;

  for (let i = 0; i < (RM ? 2 : 5); i++) {

}

function buildCloth() {

function curveThrough(pts, start) {

    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }

}
// p = 0: draped over the frame; p = 1: pulled off and gone.
function drawCloth(p) {
  if (!PT.cl) return;
  const W = PT.W, H = PT.H, n = 26, top = [], bot = [];
  for (let i = 0; i < n; i++) {
    const xr = i / (n - 1);
    const x0 = -0.045 * W + xr * 1.09 * W;
    const edge = Math.max(0, Math.abs(xr - 0.5) - 0.44) / 0.06;
    const top0 = -0.03 * H + edge * edge * 0.05 * H;
    const bot0 = 0.995 * H + Math.sin(xr * Math.PI * 7) * 0.006 * H;   // rests on the easel ledge
    const lag = 0.32 * (1 - xr);
    const q = Math.max(0, Math.min(1, (p - lag) / 0.68));
    const qe = q * q * (3 - 2 * q);
    const dx = -W * 0.7 * Math.pow(qe, 1.3);
    const dy = H * 0.5 * Math.pow(qe, 1.6);
    const wave = Math.sin(xr * 8 - p * 14) * W * 0.03 * Math.sin(Math.PI * q);
    const by = bot0 + dy * 0.6 + wave * 0.6;
    const ty = Math.min(top0 + dy + H * 0.8 * qe + wave, by - 4);
    top.push([x0 + dx + wave * 0.4, ty]);
    bot.push([x0 + dx * 1.08 + wave * 0.3, by]);
  }
  const d = curveThrough(top, 'M') + ' ' + curveThrough(bot.slice().reverse(), 'L') + ' Z';
  PT.cl.base.setAttribute('d', d);
  PT.cl.shade.setAttribute('d', d);
  PT.cl.sheen.setAttribute('d', d);
  PT.cl.trim.setAttribute('points', bot.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' '));
  PT.cl.fringe.setAttribute('points', bot.map(([x, y]) => `${x.toFixed(1)},${(y + W * 0.017).toFixed(1)}`).join(' '));
  PT.cl.g.setAttribute('opacity', p > 0.72 ? Math.max(0, 1 - (p - 0.72) / 0.28).toFixed(3) : 1);
}
function clothSheen(ms) {
  const W = PT.W;
  return tween(ms, e => PT.sheen.setAttribute('gradientTransform', `translate(${(-1.3 * W + 2.6 * W * e).toFixed(1)},0)`), ease.inOut);
}
function glareSweep() {

function partyBurst(small) {
  const n = small ? 28 : RM ? 24 : SMALL ? 50 : 80;
  const pal = ['#f3d38d', '#fff3cf', '#ffd98a', '#f7c6d0', '#c9e4f5', '#ffe9b8'];
  const W = PT.W * 1.04, H = PT.H * 1.04;
  for (let i = 0; i < n; i++) {
    const f = i / n * 2 * (W + H);
    let x, y;
    if (f < W) { x = -W / 2 + f; y = -H / 2; }
    else if (f < W + H) { x = W / 2; y = -H / 2 + (f - W); }
    else if (f < 2 * W + H) { x = W / 2 - (f - W - H); y = H / 2; }
    else { x = -W / 2; y = H / 2 - (f - 2 * W - H); }
    const a = Math.atan2(y, x) + rand(-.3, .3), v = rand(60, 150);
    particles.push({ kind: 'ember', x: PT.cx + x, y: PT.cy + y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
      life: 1, decay: rand(.5, .9), c: pal[(Math.random() * pal.length) | 0], size: rand(1, 2.2), tw: true, ph: rand(0, 6.28) });
  }
}
function lightsOn() {
  PT.bulbs.forEach((b, i) => {
    waapi(b, [{ opacity: 0 }, { opacity: 1, offset: .45 }, { opacity: .35, offset: .65 }, { opacity: 1 }],
      { duration: 520, delay: i * 120 }).then(() => { if (i % 3 === 0) sfx('tick'); }, noop);
  });

async function presentPortrait() {

  PT.shift = 1;
  // 2. a second spotlight clicks on over a covered portrait
  PT.el.classList.add('on');

  sfx('tick');
  waapi(PT.beam, [{ opacity: 0 }, { opacity: .9, offset: .12 }, { opacity: .15, offset: .2 }, { opacity: 1, offset: .32 },
    { opacity: .5, offset: .4 }, { opacity: 1 }], { duration: 1500, easing: 'linear' }).catch(noop);
  waapi(PT.glow, [{ opacity: 0 }, { opacity: 1 }], { duration: 1800 }).catch(noop);
  await waapi(PT.stand, [

    { opacity: 1, filter: 'brightness(1)' }
  ], { duration: 1700 });

// Dust drifting in the portrait's spotlight.
function drawPartyFx(t, dt) {
  if (!PT.shown || PT.mode !== 'side' || RM) return;
  const step = Math.min(dt, 50) / 1000, c = fctx;
  if (PT.motes.length < 22 && Math.random() < .25) {
    const y = rand(PT.top * 0.12, PT.top - 4), spread = PT.W * (0.25 + 0.9 * y / PT.top);
    PT.motes.push({ x: PT.cx + rand(-1, 1) * spread, y, vx: rand(-5, 5), vy: rand(-4, 4), life: 1, s: rand(.6, 1.5), ph: rand(0, 6.28) });
  }
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = PT.motes.length - 1; i >= 0; i--) {
    const m = PT.motes[i];
    m.x += (m.vx + Math.sin(t * .001 + m.ph) * 3) * step; m.y += m.vy * step;
    m.life -= step * 0.12;
    if (m.life <= 0) { PT.motes.splice(i, 1); continue; }
    c.globalAlpha = Math.sin(Math.PI * m.life) * 0.45;
    c.fillStyle = '#ffeacc';
    c.beginPath(); c.arc(m.x, m.y, m.s, 0, 6.283); c.fill();
  }
  c.restore();
}

// ----- the photo itself -----
function applyPhoto(src) {
  return new Promise(res => {
    const im = PT.img;
    im.onload = () => {
      im.onload = im.onerror = null;
      im.hidden = false; PT.empty.hidden = true;
      PT.pic.setAttribute('aria-label', 'Birthday photo. Tap to change it');
      res(true);
    };
    im.onerror = () => { im.onload = im.onerror = null; console.warn('The birthday photo could not be loaded:', src); res(false); };
    im.src = src;
  });
}
async function swapPhoto(src) {
  try {
    await waapi(PT.flash, [{ opacity: 0 }, { opacity: .95 }], { duration: 600, easing: 'ease-in' });
    await applyPhoto(src);
    partyBurst(true);
    sfx('sparkle');
    await waapi(PT.flash, [{ opacity: .95 }, { opacity: 0 }], { duration: 1400, easing: 'ease-out' });
    glareSweep();
  } catch (e) { /* replay pressed meanwhile */ }
}
function loadImage(url) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
async function loadPhotoFile(file) {
  if (!file || !/^image\//.test(file.type)) return;
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImage(url);
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));   // keep it light
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k);
    c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.9);
    if (PT.revealed) swapPhoto(data); else applyPhoto(data);
    try { localStorage.setItem(PHOTO_KEY, data); } catch (e) { /* remembering is optional */ }
  } catch (e) {
    console.warn('That file could not be opened as an image.', e);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function layoutGift() {

    const gap = PT.left - boardRight;
    boxW = Math.max(70, Math.min(120, VH * 0.15, gap + 40));

    frontLeft = (boardRight + PT.left) / 2 - 40 * k;
    frontBottom = BOARD_Y + 34 * S;
    GF.mode = 'side';
  } else {
    boxW = Math.min(130, VW * 0.24, VH * 0.14);

    frontBottom = Math.max(BOARD_Y + 14, Math.min(VH - 96, BOARD_Y + 120));

    const age = b.t - b.delay;
    const sway = Math.sin(t * 0.0016 + b.ph) * b.sw * Math.min(1, age * 1.2);
    const x = ox + b.x + sway - b.y * b.drift, y = oy + b.y - b.r * 1.3;
    if (y < -b.r * 3 - b.len) { BAL.splice(i, 1); continue; }
    const a = Math.min(1, age * 3), ky = b.r * 1.18;
    const wob = Math.sin(t * 0.003 + b.ph) * 6;
    c.globalAlpha = a * 0.55;
    c.strokeStyle = 'rgba(240,230,220,.9)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, y + ky + b.r * .12);
    c.bezierCurveTo(x + wob, y + ky + b.len * .35, x - wob, y + ky + b.len * .7, x + wob * .5, y + ky + b.len);
    c.stroke();
    c.save();
    c.translate(x, y); c.rotate(sway * 0.008);
    c.globalAlpha = a;
    const g = c.createRadialGradient(-b.r * .35, -b.r * .45, b.r * .08, 0, 0, b.r * 1.3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.2, b.c[0]); g.addColorStop(1, b.c[1]);
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, b.r, ky, 0, 0, 6.283); c.fill();
    c.fillStyle = b.c[1];
    c.beginPath(); c.moveTo(-b.r * .13, ky + b.r * .17); c.lineTo(b.r * .13, ky + b.r * .17); c.lineTo(0, ky - b.r * .04); c.closePath(); c.fill();
    c.globalAlpha = a * .5; c.fillStyle = '#ffffff';
    c.beginPath(); c.ellipse(-b.r * .38, -b.r * .5, b.r * .14, b.r * .26, -.5, 0, 6.283); c.fill();
    c.restore();
  }
  c.restore();
}

function scoreAt(x, y) {

  if (r >= 99 && r <= 107) return `Triple ${v}`;

  return `${v}`;
}

// --- throwing ---
function flyDart(hx, hy, flight, magic, tx, ty) {
  const g = dartShape(DP.layer, flight);
  const sx = tx * 0.25, sy = 560;
  const cx = magic ? tx : (sx + hx) / 2, cy = magic ? ty - 40 : Math.min(sy, hy) - 150;
  const dur = magic ? 620 : 460;
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 2), u = 1 - e;
      const x = u * u * sx + 2 * u * e * cx + e * e * hx;
      const y = u * u * sy + 2 * u * e * cy + e * e * hy;
      const s = 2.7 - 1.8 * ease.out(k);
      g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-12 * k).toFixed(2)}) scale(${s.toFixed(3)},${(s * (1 - .3 * k)).toFixed(3)})`);
      if (magic && k < 1) {
        const [px, py] = toScreen(x, y);
        particles.push({ kind: 'trail', x: px, y: py, vx: rand(-10, 10), vy: rand(-10, 10), life: 1, decay: rand(1.4, 2.2), c: '#ffd98a', size: rand(1, 2) });
      }
      if (k < 1) requestAnimationFrame(step); else res(g);
    };
    requestAnimationFrame(step);
  });
}
function stick(g, hx, hy) {
  const sh = el('ellipse', { cx: hx + 5, cy: hy + 13, rx: 7, ry: 3, fill: '#000', opacity: .35 }, DP.layer);
  DP.layer.insertBefore(sh, g);
  const t0 = performance.now();
  const step = now => {
    const t = (now - t0) / 1000;
    const rot = -12 + 7 * Math.sin(t * 38) * Math.exp(-t * 7);
    g.setAttribute('transform', `translate(${hx.toFixed(1)},${hy.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(1.05,.72)`);
    if (t < .7) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  DP.wrap.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(1px,2px)' }, { transform: 'translate(-1px,0)' }, { transform: 'translate(0,0)' }], { duration: 220 });
  const [px, py] = toScreen(hx, hy);
  for (let i = 0; i < 7; i++) {
    particles.push({ kind: 'ember', x: px, y: py, vx: rand(-60, 60), vy: rand(-80, -10), life: 1, decay: rand(1.4, 2.2),
      c: i % 2 ? '#d8cbb0' : '#f3d38d', size: rand(.8, 1.5), tw: false, ph: 0 });
  }
  // score pops up from the hit
  const label = el('text', { x: hx.toFixed(1), y: (hy - 18).toFixed(1), 'text-anchor': 'middle', fill: '#fff3cf',
    'font-family': 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif', 'font-weight': 700, 'font-size': 18,
    stroke: 'rgba(0,0,0,.55)', 'stroke-width': 3, 'paint-order': 'stroke' }, DP.board);
  label.textContent = scoreAt(hx, hy);
  label.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)', offset: .2 }, { opacity: 0, transform: 'translateY(-26px)' }],
    { duration: 1300, easing: 'ease-out' }).finished.then(() => label.remove(), () => label.remove());
}
async function throwDart(tx, ty) {
  if (DP.busy || DP.done || DP.thrown >= 5) return;
  DP.busy = true;
  if (Mic.state === 'off') Mic.start();            // ask for the microphone now, ready for the candles later
  const n = ++DP.thrown, last = n === 5;
  DP.darts.children[n - 1].classList.add('used');
  DP.darts.setAttribute('aria-label', `${5 - n} dart${5 - n === 1 ? '' : 's'} left`);
  DP.aim.setAttribute('opacity', 0);
  let hx, hy;
  if (last) {
    hx = rand(-2.5, 2.5); hy = rand(-2.5, 2.5);       // dart five always finds the bull
  } else {
    let r = Math.hypot(tx, ty), a = Math.atan2(ty, tx);
    if (r < 1) a = rand(0, 6.283);
    if (r < 34) r = rand(38, 75);                       // the bull is saving itself for dart five
    r = Math.max(30, Math.min(158, r + rand(-8, 8)));
    a += rand(-0.08, 0.08);
    hx = r * Math.cos(a); hy = r * Math.sin(a);
  }
  sfx('whoosh');
  const g = await flyDart(hx, hy, FLIGHTS[n - 1], last, tx, ty);
  sfx('thunk');
  stick(g, hx, hy);
  if (last) { await bullseye(); return; }
  if (n === 4) setMsg(LAST_LINE);
  else setMsg(DP.lines.pop());
  DP.busy = false;
}

async function bullseye() {
  DP.done = true;
  DP.pulse.remove();
  sfx('boom'); sfx('chime'); sfx('sparkle');
  for (let i = 0; i < 3; i++) {
    const c = el('circle', { cx: 0, cy: 0, r: 16, fill: 'none', stroke: '#ffd98a', 'stroke-width': 4 }, DP.board);
    c.animate([{ r: 16, opacity: 1, strokeWidth: 5 }, { r: 260, opacity: 0, strokeWidth: 1 }],
      { duration: 1300, delay: i * 220, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' }).finished.then(() => c.remove(), () => c.remove());
  }
  const flash = el('circle', { cx: 0, cy: 0, r: 175, fill: '#fff6e0', opacity: 0, 'pointer-events': 'none' }, DP.board);
  flash.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' }).finished.then(() => flash.remove(), () => flash.remove());
  const [bx, by] = toScreen(0, 0);
  const pal = ['#f3d38d', '#fff3cf', '#ffb24a', '#f7c6d0', '#c9e4f5', '#a8f0c8', '#c9a8ff'];
  for (let i = 0; i < (SMALL ? 60 : 110); i++) {
    const a = rand(0, 6.283), v = rand(60, 320);
    particles.push({ kind: 'ember', x: bx, y: by, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1, decay: rand(.45, .85),
      c: pal[(Math.random() * pal.length) | 0], size: rand(1.2, 2.6), tw: Math.random() < .5, ph: rand(0, 6.28) });
  }
  emitCelebration();
  DP.bull.animate([
    { opacity: 0, transform: 'translate(-50%,-50%) scale(.3) rotate(-8deg)' },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1.15) rotate(2deg)', offset: .55 },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', offset: .75 },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', offset: .9 },
    { opacity: 0, transform: 'translate(-50%,-50%) scale(1.06) rotate(0deg)' }
  ], { duration: 2300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  setMsg(BULL_LINE);
  await sleep(2100);
  await countdown();
  await zoomToCake();
}
async function countdown() {
  DP.cd.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: 'forwards' });
  await sleep(350);
  for (const n of ['3', '2', '1']) {
    DP.cdNum.textContent = n;
    sfx('beep');
    DP.cdNum.animate([
      { opacity: 0, transform: 'scale(1.8)', filter: 'blur(10px)' },
      { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)', offset: .3 },
      { opacity: 1, transform: 'scale(.94)', filter: 'blur(0px)', offset: .72 },
      { opacity: 0, transform: 'scale(.6)', filter: 'blur(6px)' }
    ], { duration: 950, easing: 'ease-out', fill: 'forwards' });
    await sleep(950);
  }
  sfx('go');
  DP.cd.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' });
}
async function zoomToCake() {
  // fly into the bullseye, through to the cake room
  DP.wrap.style.filter = 'none';
  for (const n of DP.page.querySelectorAll('.dp-head, .dp-info')) n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
  DP.wrap.animate([{ transform: 'scale(1)' }, { transform: 'scale(14)' }], { duration: 1300, easing: 'cubic-bezier(.6,0,.85,.35)', fill: 'forwards' });
  DP.curtain.animate([{ opacity: 0 }, { opacity: 0, offset: .45 }, { opacity: 1 }], { duration: 1300, fill: 'forwards' });
  await sleep(1350);
  DP.page.classList.add('gone');
  document.body.classList.remove('darts');
  runSequence();
  DP.curtain.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1600, easing: 'ease-out', fill: 'forwards' });
}

function startDarts() {
  document.body.classList.add('darts');
  buildDartboard();
  DP.lines = MISS_LINES.slice().sort(() => Math.random() - 0.5);
  DP.page.querySelector('.dp-head').animate([{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 900, easing: 'ease-out' });
  DP.wrap.animate([{ opacity: 0, transform: 'scale(.85) rotate(-20deg)' }, { opacity: 1, transform: 'scale(1) rotate(0deg)' }], { duration: 1100, easing: 'cubic-bezier(.2,.8,.2,1)' });
  DP.page.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    const [x, y] = toBoard(e.clientX, e.clientY);
    throwDart(x, y);
  });
  DP.page.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || DP.busy || DP.done) return;
    const [x, y] = toBoard(e.clientX, e.clientY);
    const r = Math.hypot(x, y), k = r > 165 ? 165 / r : 1;
    DP.aim.setAttribute('transform', `translate(${(x * k).toFixed(1)},${(y * k).toFixed(1)})`);
    DP.aim.setAttribute('opacity', 1);
  });
  DP.page.addEventListener('pointerleave', () => DP.aim.setAttribute('opacity', 0));
  DP.board.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); throwDart(rand(-60, 60), rand(-60, 60)); }
  });
}

// ========================================
// MAIN LOOP & START
// ========================================
let last = performance.now();
function frame(t) {
  const dt = t - last; last = t;
  drawBackground(t);
  micTick(Math.min(dt, 60));
  flickerLoop(t);
  drawFx(t, dt);
  drawPartyFx(t, dt);
  drawGiftFx(t, dt);
  requestAnimationFrame(frame);
}
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
layout();
seedAmbient();
requestAnimationFrame(frame);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fitTitle, noop);
startDarts();
})();
</script>
