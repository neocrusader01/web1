<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Shraddha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Great+Vibes&family=Homemade+Apple&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one full-viewport cinematic scene; cake centred on a dark wooden table, title floating above. */
:root {
  --night-0: #0b1020;
  --night-1: #070b16;
  --night-2: #030407;
  --gold: #f3d38d;
  --gold-glow: rgba(255, 196, 110, 0.55);
  --ink-soft: rgba(236, 228, 214, 0.62);
  --glass: rgba(18, 20, 30, 0.38);
  --glass-line: rgba(255, 255, 255, 0.10);
  --font-hand: "Caveat", "Bradley Hand", "Segoe Print", "Marker Felt", cursive;
  --font-script: "Great Vibes", "Snell Roundhand", "Segoe Script", "Apple Chancery", "Brush Script MT", cursive;
  --font-ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s: 1;
  color-scheme: dark;
}
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  background: radial-gradient(circle at 50% 38%, var(--night-0) 0%, var(--night-1) 40%, var(--night-2) 100%);
  color: var(--ink-soft);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  cursor: default;
}
#bg, #fx {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block; pointer-events: none;
}
#bg { z-index: 0; }
.spot {
  position: fixed; z-index: 1; left: 50%; top: 0;
  transform: translateX(-50%);
  pointer-events: none;
  background: linear-gradient(to bottom,
      rgba(255, 238, 210, 0.00) 0%,
      rgba(255, 236, 206, 0.055) 35%,
      rgba(255, 230, 196, 0.11) 100%);
  clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%);
  filter: blur(26px);
}
.table {
  position: fixed; z-index: 1; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 55% at 50% 10%, rgba(255, 226, 186, 0.08), transparent 70%),
    repeating-linear-gradient(to bottom, rgba(255, 220, 180, 0.018) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.10) 0 9px, transparent 9px 23px),
    linear-gradient(to bottom, #1b120c 0%, #120b07 35%, #070403 100%);
  box-shadow: inset 0 1px 0 rgba(255, 214, 170, 0.10), inset 0 18px 30px rgba(0, 0, 0, 0.45);
}
.table::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 75% 120% at 50% 0%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
}
#scene, #textLayer {
  position: fixed; left: 50%;
  transform: translateX(-50%);
}
#scene { z-index: 2; pointer-events: none; }
#cake { width: 100%; height: 100%; display: block; overflow: visible; }
.warm {
  position: fixed; z-index: 3; pointer-events: none;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 150, 60, 0.22), rgba(255, 120, 40, 0.08) 55%, transparent 100%);
  mix-blend-mode: screen;
  opacity: 0;
}
#fx { z-index: 5; }
.vignette {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
}
.dim {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: #000; opacity: 0;
  transition: opacity 1.6s ease;
}
#textLayer { z-index: 7; pointer-events: none; }
.title, .wish {
  position: absolute; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  text-align: center;
  font-family: var(--font-script);
  color: var(--gold);
  line-height: 1.15;
}
.title {
  top: calc(var(--s) * 128px);
  font-size: calc(var(--s) * 68px);
  text-shadow: 0 0 calc(var(--s) * 10px) var(--gold-glow), 0 0 calc(var(--s) * 28px) rgba(255, 170, 80, 0.30);
}
.title.shimmer { animation: shimmer 4.5s ease-in-out infinite; }
.title span {
  display: inline-block;
  opacity: 0;
  white-space: pre;
}
.title span.in { animation: letterIn 0.7s cubic-bezier(.2, .7, .2, 1) forwards; }
.wish {
  top: calc(var(--s) * 214px);
  font-size: calc(var(--s) * 40px);
  opacity: 0;
  filter: blur(6px);
  transition: opacity 2s ease, filter 2s ease;
  text-shadow: 0 0 calc(var(--s) * 12px) rgba(255, 210, 140, 0.45);
}
.wish.show { opacity: 1; filter: blur(0); }
@keyframes letterIn {
  0%   { opacity: 0; transform: translateY(0.18em) scale(0.9); filter: blur(8px); }
  60%  { opacity: 1; filter: blur(0.5px); }
  100% { opacity: 1; transform: none; filter: blur(0); }
}
@keyframes shimmer {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.18); }
}
.ui {
  position: fixed; z-index: 9;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 500 12px/1 var(--font-ui);
  letter-spacing: 0.04em;
  color: rgba(240, 232, 220, 0.75);
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 999px;
  padding: 8px 14px;
  opacity: 0.5;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: opacity .25s ease, box-shadow .25s ease, color .25s ease;
}
.ui:hover, .ui:focus-visible {
  opacity: 0.95; color: #fff;
  box-shadow: 0 0 18px rgba(255, 210, 150, 0.18);
}
.ui:focus-visible { outline: 1px solid rgba(255, 220, 170, 0.6); outline-offset: 2px; }
#replay { right: 16px; }
#sound { left: 16px; }
.hint {
  position: fixed; z-index: 8; left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font: 400 12px/1.3 var(--font-ui);
  letter-spacing: 0.06em;
  color: rgba(240, 228, 210, 0.55);
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
  white-space: nowrap;
}
.hint.show { opacity: 1; }
@media (max-width: 520px) {
  .hint { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 11px; }
}
[hidden] { display: none !important; }

/* ---------- The birthday gift (opens after the wish) ---------- */
.gift {
  position: fixed; z-index: 4; left: 0; top: 0;
  width: var(--gs, 200px); height: var(--gs, 200px);
  visibility: hidden;
  pointer-events: none;
}
.gift.on { visibility: visible; }
.gift-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.gift-btn {
  position: absolute; margin: 0; padding: 0; border: 0;
  background: transparent; border-radius: 8px;
  cursor: pointer; pointer-events: auto;
}
.gift-btn:focus-visible { outline: 2px solid rgba(255, 220, 160, .8); outline-offset: 4px; }
.gift.open .gift-btn { display: none; }
#giftRays, #giftBow, .rays-sway { transform-box: fill-box; }
#giftRays, .rays-sway { transform-origin: 50% 100%; }
#giftBow { transform-origin: 50% 70%; }
.gift.open .rays-sway { animation: raysSway 7s ease-in-out infinite; }
@keyframes raysSway {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

/* ---------- The letter: falls beside the gift, tap to open ---------- */
.env {
  position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; cursor: pointer;
  transform-origin: 50% 50%;
  filter: drop-shadow(0 5px 9px rgba(0, 0, 0, .38)) drop-shadow(0 0 8px rgba(255, 200, 120, .55));
}
.env.ready { pointer-events: auto; }
.env-body {
  position: absolute; inset: 0; border-radius: 3px;
  background: linear-gradient(160deg, #fffaf0, #efe0bf);
  box-shadow: inset 0 0 0 1px rgba(150, 105, 50, .55);
}
.env-paper {
  position: absolute; left: 9%; right: 9%; top: 16%; bottom: 12%; border-radius: 2px;
  background: #fffdf6; box-shadow: inset 0 0 0 1px rgba(150, 105, 50, .25);
  transition: transform .9s cubic-bezier(.2, .8, .2, 1) .35s;
}
.env.open .env-paper { transform: translateY(-62%); }
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 60%;
  background: linear-gradient(170deg, #fbf1dc, #e6d2a6);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: 50% 0;
  transition: transform .7s ease, opacity .7s ease .1s;
}
.env.open .env-flap { transform: rotateX(180deg); opacity: 0; }
.env-seal {
  position: absolute; left: 50%; top: 56%; width: 26%; height: 26%;
  margin: -13% 0 0 -13%; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffe2a0, #b8862e);
  box-shadow: 0 0 0 1px rgba(90, 50, 20, .45);
  transition: opacity .3s ease;
}
.env.open .env-seal { opacity: 0; }
.env-tip {
  position: absolute; left: 50%; top: 100%; margin-top: 8px; transform: translateX(-50%);
  white-space: nowrap; pointer-events: none; opacity: 0;
  font: 600 11px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); text-shadow: 0 0 8px rgba(255, 190, 110, .6);
  transition: opacity .6s ease .4s;
}
.env.ready .env-tip { opacity: .9; }
.env.open .env-tip { opacity: 0; transition-delay: 0s; }

/* while a letter is open the title and wish step aside, and come back when it closes */
#textLayer { transition: opacity .6s ease; }
body.reading #textLayer { opacity: 0; }

/* the letter overlay: dims the scene so nothing behind it competes with the text */
.letter {
  position: fixed; inset: 0; z-index: 6;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(6, 5, 10, .62);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .6s ease, visibility 0s linear .6s;
}
.letter.on {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .6s ease, visibility 0s;
}

  padding: 30px 26px 24px; border-radius: 10px;

    radial-gradient(ellipse at 50% 45%, rgba(255, 246, 220, 0) 55%, rgba(105, 65, 25, .38) 100%),

.letter.on .letter-card { opacity: 1; transform: none; transition-delay: .15s; }
.letter-card p { margin: 0 0 .5em; }
.letter-card p:first-child { font-size: 21px; font-weight: bold; margin-bottom: .6em; }
.letter-card p.gap { height: .6em; margin: 0; }
.letter-close {
  position: absolute; right: 8px; top: 4px; border: 0; background: transparent;
  font-size: 24px; line-height: 1; color: #6b4423; cursor: pointer; padding: 6px;
}
.letter-close:focus-visible { outline: 2px solid #b8862e; outline-offset: 2px; }

/* ---------- The big party portrait ---------- */
.party {
  position: fixed; z-index: 4; left: 0; top: 0;
  width: var(--pw, 300px); height: calc(var(--pw, 300px) * 1.25);
  perspective: 1400px;
  visibility: hidden;

const bg = $('bg'), bctx = bg.getContext('2d');
const fx = $('fx'), fctx = fx.getContext('2d');
let VW = 0, VH = 0, DPR = 1, S = 1, BOARD_Y = 0, SCENE_TOP = 0;
let bokeh = [], bulbs = [];

function layout() {
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const portrait = VH > VW;
  BOARD_Y = VH * (portrait ? 0.78 : 0.80);
  S = Math.min(VW * (portrait ? 0.94 : 0.9) / 600, (BOARD_Y - VH * 0.03) / 600);
  SCENE_TOP = BOARD_Y - 600 * S;
  for (const n of [ui.scene, ui.textLayer]) {
    n.style.width = 600 * S + 'px';
    n.style.height = 700 * S + 'px';
    n.style.top = SCENE_TOP + 'px';
  }
  document.documentElement.style.setProperty('--s', S.toFixed(4));
  ui.table.style.top = (BOARD_Y - 64 * S) + 'px';
  ui.spot.style.width = 820 * S + 'px';
  ui.spot.style.height = (BOARD_Y + 70 * S) + 'px';
  ui.warm.style.left = VW / 2 + 'px';
  ui.warm.style.top = (SCENE_TOP + 420 * S) + 'px';
  ui.warm.style.width = 1000 * S + 'px';
  ui.warm.style.height = 760 * S + 'px';
  for (const c of [bg, fx]) { c.width = VW * DPR; c.height = VH * DPR; }
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBulbs();
  if (!bokeh.length) buildBokeh();
  layoutParty();
  layoutGift();
  applyCakeShift(PT.shift);
  fitTitle();
}

function buildBokeh() {
  const n = SMALL ? 12 : 24;
  const cols = ['255,200,140', '255,170,190', '170,200,255', '255,236,200'];
  bokeh = Array.from({ length: n }, () => ({
    x: rand(), y: rand(0, .75), r: rand(14, 60), a: rand(.025, .07),
    c: cols[(Math.random() * cols.length) | 0],
    vx: rand(-.004, .004), vy: rand(-.008, -.001), ph: rand(0, 6.28)
  }));
}

function buildBulbs() {
  bulbs = [];
  const cols = ['255,205,120', '255,170,195', '170,205,255', '255,240,215'];
  const n = Math.max(12, Math.round(VW / 55));
  for (let i = 0; i <= n; i++) {
    const x = (i / n) * VW;
    bulbs.push({
      x, y: wireY(x) + 4, c: cols[i % cols.length],
      sp: rand(.6, 1.8), ph: rand(0, 6.28), sp2: rand(2, 5), base: rand(.7, .95)
    });
  }
}
function wireY(x) {
  const swags = VW < 700 ? 2 : 3;
  const seg = VW / swags;
  const f = (x % seg) / seg;
  const top = VH * 0.035, sag = Math.min(VH * 0.085, 70);
  return top + sag * Math.sin(Math.PI * f) + 6 * Math.sin(x / VW * Math.PI);
}

function drawBackground(t) {
  bctx.clearRect(0, 0, VW, VH);
  // bokeh
  for (const b of bokeh) {
    if (!RM) { b.x += b.vx * 0.016; b.y += b.vy * 0.016; }
    if (b.y < -0.1) { b.y = 0.8; b.x = rand(); }
    if (b.x < -0.1) b.x = 1.1; if (b.x > 1.1) b.x = -0.1;
    const x = b.x * VW, y = b.y * VH;
    const a = b.a * (0.75 + 0.25 * Math.sin(t * 0.0004 + b.ph));
    const g = bctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, `rgba(${b.c},${a})`);
    g.addColorStop(.7, `rgba(${b.c},${a * .6})`);
    g.addColorStop(1, `rgba(${b.c},0)`);
    bctx.fillStyle = g;
    bctx.beginPath(); bctx.arc(x, y, b.r, 0, 6.283); bctx.fill();
  }
  // wire
  bctx.strokeStyle = 'rgba(120,100,70,0.45)';
  bctx.lineWidth = 1;
  bctx.beginPath();
  for (let x = 0; x <= VW; x += 6) { const y = wireY(x); x === 0 ? bctx.moveTo(x, y) : bctx.lineTo(x, y); }
  bctx.stroke();
  // bulbs
  for (const b of bulbs) {
    let k = b.base + (RM ? 0.05 : 0.22) * Math.sin(t * 0.001 * b.sp + b.ph) + (RM ? 0 : 0.06 * Math.sin(t * 0.001 * b.sp2 + b.ph * 2));
    k = Math.max(0.3, Math.min(1.1, k));
    const r = 16 + 8 * k;
    const g = bctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0, `rgba(${b.c},${0.55 * k})`);
    g.addColorStop(.25, `rgba(${b.c},${0.22 * k})`);
    g.addColorStop(1, `rgba(${b.c},0)`);
    bctx.fillStyle = g;
    bctx.beginPath(); bctx.arc(b.x, b.y, r, 0, 6.283); bctx.fill();
    bctx.fillStyle = 'rgba(60,50,40,0.9)';
    bctx.fillRect(b.x - 1.5, b.y - 6, 3, 3);
    bctx.fillStyle = `rgba(${b.c},${0.75 + 0.25 * k})`;
    bctx.beginPath(); bctx.ellipse(b.x, b.y, 2.4, 3.2, 0, 0, 6.283); bctx.fill();
    bctx.fillStyle = `rgba(255,255,255,${0.6 * k})`;
    bctx.beginPath(); bctx.arc(b.x - .6, b.y - .8, 1, 0, 6.283); bctx.fill();
  }
}

// ANIMATION HELPERS
// ========================================
const CANCEL = { cancelled: true };
let RUN = 0;
const ease = {
  out: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  in: p => p * p,
  back: p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  lin: p => p
};

function wait(ms) {
  const my = RUN;
  return new Promise((res, rej) => setTimeout(() => (my === RUN ? res() : rej(CANCEL)), T(ms)));
}
function tween(ms, fn, ez = ease.lin) {
  const my = RUN, dur = T(ms);
  return new Promise((res, rej) => {
    const t0 = performance.now();
    const step = now => {
      if (my !== RUN) return rej(CANCEL);
      const p = dur <= 0 ? 1 : Math.min(1, (now - t0) / dur);
      fn(ez(p), p);
      if (p < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
// WAAPI wrapper: origin in view-box units, durations scaled by T().
function anim(node, frames, opts = {}, ox, oy) {
  const my = RUN;
  node.style.transformBox = 'view-box';
  if (ox != null) node.style.transformOrigin = `${ox}px ${oy}px`;
  const a = node.animate(frames, {
    fill: 'forwards', easing: 'ease', ...opts,
    duration: T(opts.duration || 600), delay: T(opts.delay || 0)
  });
  return a.finished.then(() => { if (my !== RUN) throw CANCEL; }, () => { throw CANCEL; });
}
const fadeIn = (n, ms = 400, delay = 0) => anim(n, [{ opacity: 0 }, { opacity: 1 }], { duration: ms, delay });
const fadeOut = (n, ms = 400, delay = 0) => anim(n, [{ opacity: 1 }, { opacity: 0 }], { duration: ms, delay });

// Physical drop with squash & stretch, origin at the landing point.
function dropLayer(g, yLand, { dist = 330, dur = 1150, squash = 0.05 } = {}) {
  return anim(g, [
    { transform: `translateY(${-dist}px) scale(0.985,1.03)`, opacity: 0, easing: 'cubic-bezier(.5,0,.75,.35)' },
    { opacity: 1, offset: .18 },
    { transform: 'translateY(-14px) scale(0.99,1.02)', offset: .52, easing: 'cubic-bezier(.2,.6,.4,1)' },
    { transform: `translateY(0) scale(${1 + squash * .4},${1 - squash})`, offset: .66, easing: 'ease-out' },
    { transform: 'translateY(-4px) scale(0.998,1.008)', offset: .82, easing: 'ease-in-out' },
    { transform: 'translateY(0) scale(1,1)', opacity: 1 }
  ], { duration: dur }, CX, yLand);
}
// Small object dropped onto a surface with spin and a soft bounce.
function dropItem(g, x, y, { from = 150, dur = 650, rot = rand(-50, 50), delay = 0 } = {}) {
  return anim(g, [
    { transform: `translate(${rand(-20, 20)}px,${-from}px) rotate(${rot}deg)`, opacity: 0, easing: 'cubic-bezier(.45,0,.8,.45)' },
    { opacity: 1, offset: .2 },
    { transform: 'translate(0,0) rotate(0deg) scale(1.06,.92)', offset: .68, easing: 'ease-out' },
    { transform: 'translate(0,-3px) rotate(0deg) scale(.98,1.03)', offset: .84, easing: 'ease-in-out' },

// Insert into the top-surface layer sorted by y so near objects overlap far ones.
function insertSorted(layer, node, y) {
  node.dataset.y = y;
  const kids = [...layer.children];
  const after = kids.find(k => parseFloat(k.dataset.y) > y);
  layer.insertBefore(node, after || null);
}

// SOUND (Web Audio, off by default)
// ========================================
const Sound = {
  on: false, ctx: null, master: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  tone(f, dur, type = 'sine', vol = .15, slide) {
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, vol, freq, type = 'lowpass') {
    const c = this.ctx, t = c.currentTime;
    const buf = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx) return;
    try {
      switch (name) {
        case 'land': this.tone(120, .28, 'sine', .22, 55); this.noise(.12, .05, 380); break;
        case 'pipe': this.noise(.45, .025, 900, 'bandpass'); break;
        case 'pop': this.tone(rand(520, 760), .09, 'sine', .05, rand(820, 980)); break;
        case 'tick': this.tone(rand(900, 1300), .05, 'triangle', .02); break;
        case 'sparkle': [1568, 2093, 2637].forEach((f, i) => setTimeout(() => this.on && this.tone(f, .35, 'sine', .025), i * 70)); break;
        case 'strike': this.noise(.22, .12, 2600, 'highpass'); break;
        case 'ignite': this.noise(.18, .05, 1200, 'bandpass'); this.tone(240, .25, 'triangle', .02, 320); break;
        case 'chime': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.on && this.tone(f, 1.6, 'sine', .05), i * 140)); break;
        case 'blow': this.noise(.7, .06, 650); break;
        case 'slide': this.noise(.5, .03, 500, 'bandpass'); break;
        case 'thunk': this.tone(170, .14, 'sine', .25, 70); this.noise(.08, .12, 1500); break;
        case 'beep': this.tone(880, .2, 'sine', .08); break;
        case 'go': this.tone(1318.5, .5, 'sine', .08); this.tone(659.25, .5, 'sine', .05); break;
        case 'whoosh': this.noise(.9, .035, 1800, 'bandpass'); break;
        case 'boom': this.tone(90, .6, 'sine', .14, 40); this.noise(.5, .07, 900); setTimeout(() => this.on && this.noise(.6, .025, 4000, 'highpass'), 120); break;
      }
    } catch (e) { /* audio is optional */ }
  }
};
const sfx = n => Sound.play(n);

function sidePath(cx, yTop, yBot, rx, ry) {
  return `M${cx - rx},${yTop} L${cx - rx},${yBot} A${rx},${ry} 0 0 0 ${cx + rx},${yBot} L${cx + rx},${yTop} A${rx},${ry} 0 0 1 ${cx - rx},${yTop} Z`;
}
function clipFor(d) {
  const id = uid('cp');
  const cp = el('clipPath', { id }, dyn);
  el('path', { d }, cp);
  return `url(#${id})`;
}
// Generic cylinder: side (with optional texture + vertical shading) and top ellipse.
function cylinder(parent, { cx = CX, yTop, yBot, rx, ry, side, top, texture, rim, shade = true }) {
  const g = el('g', {}, parent);
  const d = sidePath(cx, yTop, yBot, rx, ry);
  const sideP = el('path', { d, fill: side }, g);
  if (texture) {
    const tg = el('g', { 'clip-path': clipFor(d) }, g);
    texture(tg, { cx, yTop, yBot, rx, ry });
  }
  if (shade) el('path', { d, fill: P.shadeV }, g);
  const topE = el('ellipse', { cx, cy: yTop, rx, ry, fill: top }, g);
  if (rim) { topE.setAttribute('stroke', rim); topE.setAttribute('stroke-width', 1.2); }
  return { g, sideP, topE, d };
}
// Baked sponge texture: pores, air pockets and crumbs.
function spongeTexture(kind) {
  return (tg, { cx, yTop, yBot, rx, ry }) => {
    const dark = kind === 'choc' ? '#120703' : '#6d4a1f';
    const light = kind === 'choc' ? '#8a5638' : '#f7dca6';
    const n = Math.round(rx * 0.55);
    for (let i = 0; i < n; i++) {
      const x = cx + rand(-rx, rx);
      const k = Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2));
      const y = rand(yTop + 2, yBot + ry * k - 1);
      const r = rand(0.6, 2.4);
      el('ellipse', { cx: x, cy: y, rx: r * rand(1, 1.6), ry: r * rand(.6, 1), fill: dark, opacity: rand(.18, .42) }, tg);
      if (Math.random() < .35) el('circle', { cx: x + rand(-1, 1), cy: y - r * .7, r: r * .45, fill: light, opacity: rand(.18, .38) }, tg);
    }
    // baked crust line along the top edge
    el('path', { d: `M${cx - rx},${yTop + 1.5} A${rx},${ry} 0 0 0 ${cx + rx},${yTop + 1.5}`, fill: 'none', stroke: dark, 'stroke-width': 2.2, opacity: .32 }, tg);
  };
}
function spongeTopCrumbs(parent, cx, y, rx, ry, kind) {
  const c = kind === 'choc' ? '#2a150b' : '#a57a3f';
  for (let i = 0; i < Math.round(rx * .16); i++) {
    const a = rand(0, 6.283), r = Math.sqrt(Math.random()) * .9;
    el('ellipse', { cx: cx + Math.cos(a) * rx * r, cy: y + Math.sin(a) * ry * r, rx: rand(.8, 2), ry: rand(.4, .9), fill: c, opacity: rand(.2, .45) }, parent);
  }
}
function createSponge(parent, { yBot, h, rx, ry, kind }) {
  const yTop = yBot - h;
  const c = cylinder(parent, {
    yTop, yBot, rx, ry,
    side: kind === 'choc' ? P.chocSide : P.vanSide,
    top: kind === 'choc' ? P.chocTop : P.vanTop,
    texture: spongeTexture(kind),
    rim: kind === 'choc' ? 'rgba(30,14,6,.55)' : 'rgba(150,104,48,.5)'

  spongeTopCrumbs(c.g, CX, yTop, rx, ry, kind);

}

function createStrawberrySlice(parent, x, y, s = 1, rot = 0) {
  const outer = el('g', {}, parent);
  const g = el('g', { transform: `translate(${x},${y}) scale(${s},${s * .5}) rotate(${rot})` }, outer);
  el('ellipse', { cx: 1, cy: 3, rx: 13, ry: 14, fill: '#000', opacity: .14 }, g);

// ---------- Tools ----------
class Tool {
  constructor(g) { this.g = g; this.x = 0; this.y = 0; this.r = 0; this.o = 0; this.apply(); }
  apply() {
    this.g.setAttribute('transform', `translate(${this.x.toFixed(2)},${this.y.toFixed(2)}) rotate(${this.r.toFixed(2)})`);
    this.g.setAttribute('opacity', this.o.toFixed(3));
  }
  set(p) { Object.assign(this, p); this.apply(); return this; }
  to(p, ms, ez = ease.inOut) {
    const a = { x: this.x, y: this.y, r: this.r, o: this.o };
    const b = { ...a, ...p };
    return tween(ms, e => {
      this.x = a.x + (b.x - a.x) * e; this.y = a.y + (b.y - a.y) * e;
      this.r = a.r + (b.r - a.r) * e; this.o = a.o + (b.o - a.o) * e;
      this.apply();
    }, ez);
  }
  remove() { this.g.remove(); }
}

// Cream spiral piped onto a round surface. The bag tip follows the path.
async function pipeSpiral({ cy, rx, ry, cream, parent, onProgress }) {
  const pts = [];
  const turns = 2.4, N = 140;
  for (let i = 0; i <= N; i++) {
    const f = i / N, r = 0.06 + 0.84 * f, th = -Math.PI / 2 + f * turns * Math.PI * 2;
    pts.push(`${(CX + rx * r * Math.cos(th)).toFixed(1)},${(cy + ry * r * Math.sin(th)).toFixed(1)}`);
  }
  const d = 'M' + pts.join(' L');
  const g = el('g', {}, parent);
  const path = el('path', { d, fill: 'none', stroke: cream, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  const hi = el('path', { d, fill: 'none', stroke: '#ffffff', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: .55, transform: 'translate(-1,-2)' }, g);
  const len = path.getTotalLength();
  for (const p of [path, hi]) { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; }
  const bag = makePipingBag(cream);
  const p0 = path.getPointAtLength(0);
  bag.set({ x: p0.x + 160, y: p0.y - 220, r: 22, o: 0 });
  await bag.to({ x: p0.x, y: p0.y - 1, r: 18, o: 1 }, 700, ease.out);
  bag.squeeze(true); sfx('pipe');
  await tween(1700, e => {
    const l = len * e;
    path.style.strokeDashoffset = len - l;
    hi.style.strokeDashoffset = len - l;
    const p = path.getPointAtLength(l);
    bag.set({ x: p.x, y: p.y - 1, r: 18 + 6 * Math.sin(e * 9) });
    if (onProgress) onProgress(e);
  }, ease.inOut);
  bag.squeeze(false);
  await bag.to({ x: CX + rx + 120, y: cy - 200, r: 30, o: 0 }, 600, ease.in);
  bag.remove();
  return g;
}

// Frosting: palette knife spreads buttercream around the side, then across the top.
async function frostTier({ yTop, yBot, rx, ry, side, top, parent, label }) {
  const g = el('g', {}, parent);
  const d = sidePath(CX, yTop, yBot, rx, ry);
  // side, revealed by a sweeping clip
  const cs = uid('fc'), cpS = el('clipPath', { id: cs }, dyn);
  const rS = el('rect', { x: CX - rx - 2, y: yTop - ry - 6, width: 0, height: yBot - yTop + 2 * ry + 12 }, cpS);
  const sideG = el('g', { 'clip-path': `url(#${cs})` }, g);
  el('path', { d, fill: side }, sideG);
  const marks = el('g', { 'clip-path': clipFor(d), opacity: .5 }, sideG);
  for (let i = 0; i < 6; i++) {
    const yy = yTop + (yBot - yTop) * (i + .5) / 6;
    el('path', { d: `M${CX - rx},${yy} A${rx},${ry} 0 0 0 ${CX + rx},${yy}`, fill: 'none', stroke: '#fff', 'stroke-width': .7, opacity: rand(.1, .3) }, marks);
  }
  el('path', { d, fill: P.shadeV }, sideG);
  // top, revealed by a second sweep
  const ct = uid('ft'), cpT = el('clipPath', { id: ct }, dyn);
  const rT = el('rect', { x: CX - rx - 2, y: yTop - ry - 4, width: 0, height: ry * 2 + 8 }, cpT);
  const topG = el('g', { 'clip-path': `url(#${ct})` }, g);
  el('ellipse', { cx: CX, cy: yTop, rx, ry, fill: top }, topG);
  el('path', { d: `M${CX - rx * .86},${yTop - ry * .2} A${rx * .9},${ry * .8} 0 0 1 ${CX + rx * .2},${yTop - ry * .82}`, fill: 'none', stroke: '#fff', 'stroke-width': 1.6, opacity: .45, 'stroke-linecap': 'round' }, topG);
  // gloss band
  const glossG = el('g', { 'clip-path': clipFor(d), opacity: 0 }, g);
  const gloss = el('rect', { x: CX - rx * .62, y: yTop - ry, width: rx * .26, height: yBot - yTop + ry * 2, fill: P.gloss }, glossG);
  el('rect', { x: CX + rx * .55, y: yTop - ry, width: rx * .1, height: yBot - yTop + ry * 2, fill: P.gloss, opacity: .5 }, glossG);

  const sp = makeSpatula();
  const frontY = x => yBot + ry * Math.sqrt(Math.max(0, 1 - ((x - CX) / rx) ** 2));
  const x0 = CX - rx;
  sp.set({ x: x0 - 140, y: frontY(x0) - 40, r: -25, o: 0 });
  await sp.to({ x: x0 + 4, y: frontY(x0 + 4) - 1, r: 6, o: 1 }, 600, ease.out);
  sfx('slide');
  await tween(1500, e => {
    const x = x0 + 4 + (rx * 2 - 8) * e;
    rS.setAttribute('width', x - (CX - rx - 2) + 4);
    sp.set({ x, y: frontY(x) - 1, r: 6 - 12 * e + 3 * Math.sin(e * 12) });
  }, ease.inOut);
  rS.setAttribute('width', rx * 2 + 4);
  // top pass: knife lies nearly flat
  await sp.to({ x: CX - rx + 6, y: yTop + 2, r: -84 }, 450, ease.inOut);
  sfx('slide');
  await tween(900, e => {
    const x = CX - rx + 6 + (rx * 2 + 6) * e;
    rT.setAttribute('width', x - (CX - rx - 2) + 10);
    sp.set({ x, y: yTop + 2 - 4 * Math.sin(e * Math.PI), r: -84 + 4 * Math.sin(e * 8) });
  }, ease.inOut);
  rT.setAttribute('width', rx * 2 + 4);
  // final finishing pass + gloss
  fadeIn(glossG, 700).catch(noop);
  await sp.to({ x: CX + rx - 30, y: yTop - 6, r: -88 }, 300);
  await sp.to({ x: CX + rx + 160, y: yTop - 120, r: -60, o: 0 }, 550, ease.in);
  sp.remove();
  return { g, gloss: glossG };
}

// Glossy drip: pour stream, puddle spreads, rim band then individual drips of varied length.
async function dripTier({ yTop, rx, ry, topFill, sideFill, pourFill, parent, n, minL, maxL, highlight }) {
  const g = el('g', {}, parent);
  // stream
  const stream = el('rect', { x: CX - 4.5, y: yTop - 330, width: 9, height: 330, rx: 4.5, fill: pourFill }, L.fx);
  await anim(stream, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 380, easing: 'cubic-bezier(.5,0,.9,.5)' }, CX, yTop - 330);
  sfx('pipe');
  // puddle
  const puddle = el('ellipse', { cx: CX, cy: yTop, rx: rx * .985, ry: ry * .985, fill: topFill }, g);
  const hl = el('path', { d: `M${CX - rx * .75},${yTop - ry * .25} A${rx * .8},${ry * .75} 0 0 1 ${CX + rx * .1},${yTop - ry * .8}`, fill: 'none', stroke: highlight, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0 }, g);
  await tween(800, e => {
    const k = 0.08 + 0.92 * e;
    puddle.setAttribute('transform', `translate(${CX},${yTop}) scale(${k}) translate(${-CX},${-yTop})`);
  }, ease.out);
  puddle.removeAttribute('transform');
  anim(stream, [{ transform: 'scaleY(1)', opacity: 1 }, { transform: 'scaleY(0)', opacity: .6 }], { duration: 300, easing: 'ease-in' }, CX, yTop).then(() => stream.remove(), () => stream.remove());
  // rim band along the front edge with a soft wavy lower edge
  const N = 64, upper = [], lower = [];
  for (let i = 0; i <= N; i++) {
    const t = Math.PI * i / N, x = CX + rx * Math.cos(t), y = yTop + ry * Math.sin(t);
    upper.push(`${x.toFixed(1)},${(y - .5).toFixed(1)}`);
    lower.unshift(`${x.toFixed(1)},${(y + 5 + 1.6 * Math.sin(i * 1.7)).toFixed(1)}`);
  }
  const band = el('path', { d: `M${upper.join(' L')} L${lower.join(' L')}Z`, fill: sideFill, opacity: 0 }, g);
  g.appendChild(puddle); g.appendChild(hl);
  await fadeIn(band, 250);
  // drips
  const drips = [];
  for (let i = 0; i < n; i++) {
    const t = Math.PI * (0.05 + 0.9 * (i + rand(.2, .8)) / n);
    const x = CX + rx * Math.cos(t), y = yTop + ry * Math.sin(t) + 3;
    const w = (7 + rand(0, 5)) * Math.pow(Math.sin(t), .5);
    const roll = Math.random();
    const Lh = roll < .3 ? rand(minL * .5, minL) : roll < .75 ? rand(minL, (minL + maxL) / 2) : rand((minL + maxL) / 2, maxL);
    const outer = el('g', { transform: `translate(${x.toFixed(1)},${y.toFixed(1)}) skewX(${rand(-4, 4).toFixed(1)})` }, g);
    const dg = el('g', {}, outer);
    el('path', { d: `M${-w / 2},0 L${-w / 2 * .9},${Lh} C${-w * .62},${Lh + w * .95} ${w * .62},${Lh + w * .95} ${w / 2 * .9},${Lh} L${w / 2},0 Z`, fill: sideFill }, dg);
    el('path', { d: `M${-w * .22},1 L${-w * .2},${Lh}`, stroke: highlight, 'stroke-width': Math.max(.8, w * .14), 'stroke-linecap': 'round', opacity: .55 }, dg);
    dg.style.transformBox = 'fill-box'; dg.style.transformOrigin = '50% 0';
    dg.style.transform = 'scaleY(0)';
    drips.push(dg);
  }
  await Promise.all(drips.map((dg, i) => {
    const my = RUN;
    return dg.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(.7)', offset: .5 }, { transform: 'scaleY(1)' }],
      { duration: T(rand(900, 1500)), delay: T(rand(0, 450)), easing: 'cubic-bezier(.2,.6,.3,1)', fill: 'forwards' })
      .finished.then(() => { if (my !== RUN) throw CANCEL; }, () => { throw CANCEL; });
  }));
  await anim(hl, [{ opacity: 0 }, { opacity: .7 }], { duration: 500 });
  return g;
}

// CANDLE SYSTEM
// ========================================
function createCandle(x, yBase, color, h = 46, w = 7) {
  const g = el('g', {}, null);
  el('ellipse', { cx: x + 2, cy: yBase + 1, rx: 5.5, ry: 1.8, fill: '#000', opacity: .3 }, g);
  const id = uid('cc'), cp = el('clipPath', { id }, dyn);
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, rx: 1.6 }, cp);
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, rx: 1.6, fill: color }, g);
  const st = el('g', { 'clip-path': `url(#${id})` }, g);
  for (let k = -1; k < h / 6 + 1; k++) {
    const yy = yBase - h + k * 6.5;
    el('line', { x1: x - w / 2 - 1, y1: yy + 4, x2: x + w / 2 + 1, y2: yy - 1, stroke: '#fff', 'stroke-width': 1.6, opacity: .55 }, st);
  }
  el('rect', { x: x - w / 2, y: yBase - h, width: w, height: h, fill: P.candleShade }, st);
  el('ellipse', { cx: x, cy: yBase - h, rx: w / 2, ry: 1.2, fill: '#ffffff', opacity: .55 }, g);
  el('path', { d: `M${x},${yBase - h} Q${x + .9},${yBase - h - 3} ${x + .3},${yBase - h - 5.5}`, stroke: '#2a2018', 'stroke-width': 1.2, fill: 'none', 'stroke-linecap': 'round' }, g);
  return { g, x, yBase, top: yBase - h - 5.5 };
}

function createFlame(parent, x, y) {
  const g = el('g', { transform: `translate(${x},${y})` }, parent);
  const glow = el('circle', { cx: 0, cy: -9, r: 30, fill: P.flameGlow, opacity: 0 }, g);
  const f = el('g', { transform: 'scale(0)' }, g);
  el('path', { d: 'M0,0 C-5.5,-1 -6.5,-9 -3.5,-15 C-2,-19 -.5,-22 0,-27 C1.5,-21 5,-17 5.5,-11 C6.5,-4 4,0 0,0Z', fill: P.flameOuter }, f);
  el('path', { d: 'M0,-1 C-3,-1.5 -3.6,-6 -2,-10 C-1,-13 0,-15 0,-18 C1,-14 3.2,-11 3.2,-7 C3.4,-3 2,-1 0,-1Z', fill: P.flameInner }, f);
  el('ellipse', { cx: 0, cy: -2.6, rx: 2.6, ry: 3.3, fill: P.flameBlue }, f);
  el('ellipse', { cx: 0, cy: -6.5, rx: 1.1, ry: 2.6, fill: '#fff', opacity: .85 }, f);
  const fl = { g, f, glow, x, y, level: 0, ph: [rand(0, 9), rand(0, 9), rand(0, 9), rand(0, 9)], sp: rand(.85, 1.25) };
  flames.push(fl);
  return fl;
}

let warmLevel = 0;
function flickerLoop(t) {
  const amp = RM ? .35 : 1;
  let sum = 0;
  for (const fl of flames) {
    const k = fl.level;
    sum += k;
    if (k <= 0.001) { fl.f.setAttribute('transform', 'scale(0)'); fl.glow.setAttribute('opacity', 0); continue; }
    const s = t * 0.001 * fl.sp, p = fl.ph;
    const n1 = Math.sin(s * 9.1 + p[0]) * .6 + Math.sin(s * 23.7 + p[1]) * .4;
    const n2 = Math.sin(s * 7.3 + p[2]) * .5 + Math.sin(s * 31.3 + p[3]) * .5;
    const n3 = Math.sin(s * 3.1 + p[1]) * .7 + Math.sin(s * 13.9 + p[2]) * .3;
    // breath from the microphone makes the flame lean, stretch and shiver
    const w = fl.out ? 0 : wind, gust = w * (0.75 + 0.25 * Math.sin(s * 40 + p[0]));
    const sx = k * (1 + .07 * n1 * amp + .12 * gust), sy = k * (1 + .13 * n2 * amp - .38 * gust), rot = 5 * n3 * amp + 32 * gust + 8 * gust * n1;
    fl.f.setAttribute('transform', `rotate(${rot.toFixed(2)}) scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
    fl.glow.setAttribute('opacity', (k * (.78 + .22 * n2 * amp)).toFixed(3));
  }
  const target = flames.length ? sum / flames.length : 0;
  warmLevel += (target - warmLevel) * 0.08;
  const flick = 0.92 + 0.08 * Math.sin(t * 0.013) * Math.sin(t * 0.0071);
  if (S_.warmSvg) S_.warmSvg.setAttribute('opacity', (warmLevel * flick).toFixed(3));
  ui.warm.style.opacity = (warmLevel * flick).toFixed(3);
  PT.el.style.setProperty('--warm', (warmLevel * flick * 0.8).toFixed(3));
}

const particles = [];
function emitCelebration() {
  const n = RM ? 20 : SMALL ? 50 : 90;
  const cols = ['#f3d38d', '#ffe9b8', '#f7c6d0', '#c9e4f5', '#fbe7a8', '#d6c8f2'];
  for (let i = 0; i < n; i++) {
    particles.push({
      kind: Math.random() < .55 ? 'spark' : 'confetti',
      x: rand(0, VW), y: rand(-VH * .5, -10),
      vx: rand(-12, 12), vy: rand(22, 55), rot: rand(0, 6.28), vr: rand(-2, 2),
      size: rand(2, 5), c: cols[(Math.random() * cols.length) | 0], ph: rand(0, 6.28), life: 1, ambient: false
    });
  }
}
function seedAmbient() {
  const n = SMALL ? 10 : 20;
  for (let i = 0; i < n; i++) particles.push({ kind: 'mote', ambient: true, x: rand(0, VW), y: rand(0, VH), vx: rand(-4, 4), vy: rand(-8, -2), size: rand(.6, 1.6), ph: rand(0, 6.28), c: '#ffe2a8', life: 1 });
}
function drawFx(t, dt) {
  fctx.clearRect(0, 0, VW, VH);
  const step = Math.min(dt, 50) / 1000 * (RM ? .4 : 1);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.kind === 'rocket' || p.kind === 'ember' || p.kind === 'trail' || p.kind === 'flash') {
      if (drawFirework(p, step, t)) particles.splice(i, 1);
      continue;
    }
    p.x += (p.vx + Math.sin(t * .001 + p.ph) * 10) * step;
    p.y += p.vy * step;
    if (p.ambient) {
      if (p.y < -10) { p.y = VH + 10; p.x = rand(0, VW); }
      const a = .25 + .25 * Math.sin(t * .0015 + p.ph);
      fctx.fillStyle = `rgba(255,226,168,${a})`;
      fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 6.283); fctx.fill();
      continue;
    }
    if (p.y > VH * .92) p.life -= step * 1.5;
    if (p.life <= 0 || p.y > VH + 20) { particles.splice(i, 1); continue; }
    p.rot += p.vr * step;
    fctx.save();
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life)) * (p.kind === 'spark' ? .6 + .4 * Math.sin(t * .008 + p.ph) : .75);
    fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    if (p.kind === 'spark') {
      const s = p.size * 1.6;
      fctx.fillStyle = p.c;
      fctx.shadowColor = p.c; fctx.shadowBlur = 8;
      fctx.beginPath();
      fctx.moveTo(0, -s); fctx.lineTo(s * .22, -s * .22); fctx.lineTo(s, 0); fctx.lineTo(s * .22, s * .22);
      fctx.lineTo(0, s); fctx.lineTo(-s * .22, s * .22); fctx.lineTo(-s, 0); fctx.lineTo(-s * .22, -s * .22);
      fctx.closePath(); fctx.fill();
    } else {
      fctx.fillStyle = p.c;
      fctx.scale(1, Math.cos(t * .004 + p.ph));
      fctx.fillRect(-p.size, -p.size * .45, p.size * 2, p.size * .9);
    }
    fctx.restore();
  }
}

function smokeWisp(x, y, delay = 0) {
  for (let k = 0; k < 2; k++) {
    const p = el('path', { fill: 'none', stroke: '#d9d6dc', 'stroke-width': 1.5, 'stroke-linecap': 'round', opacity: 0, filter: 'url(#blur2)' }, L.fx);

      await wait(delay + k * 160);

        const len = 18 + 120 * e;
        let d = `M${x},${y}`;
        for (let j = 1; j <= 16; j++) {
          const f = j / 16;
          const amp = (1.5 + 13 * e) * f;
          const xx = x + amp * Math.sin(j * .55 + ph + e * 5) + drift * f * e * 22;

// ---------- Microphone: blow detection ----------
// Blowing into a mic gives a loud, noise-like (spectrally flat) signal.
// Speech and music are tonal, so flatness keeps them from blowing the candles out.
const Mic = {
  state: 'off', // off | pending | suspended | on | denied
  ctx: null, an: null, td: null, fd: null, floor: 0.01,
  async start() {
    // microphone disabled: candles are blown out by tapping or clicking
    this.state = 'denied'; updateHint(); return;
    if (this.state !== 'off') return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.state = 'denied'; updateHint(); return; }
    this.state = 'pending'; updateHint();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      const src = this.ctx.createMediaStreamSource(stream);
      this.an = this.ctx.createAnalyser();
      this.an.fftSize = 1024;
      this.an.smoothingTimeConstant = 0.3;
      src.connect(this.an);
      this.td = new Float32Array(this.an.fftSize);
      this.fd = new Uint8Array(this.an.frequencyBinCount);
      if (this.ctx.state === 'suspended') { try { await this.ctx.resume(); } catch (e) { /* needs a tap */ } }
      this.state = this.ctx.state === 'running' ? 'on' : 'suspended';
    } catch (e) {
      this.state = 'denied';
    }
    updateHint();
  },
  resume() {
    if (this.ctx && this.ctx.state !== 'running') {
      this.ctx.resume().then(() => { this.state = 'on'; updateHint(); }, noop);
    }
  },
  // Returns blow strength 0..1
  read() {
    if (this.state !== 'on') return 0;
    this.an.getFloatTimeDomainData(this.td);
    let s = 0;
    for (let i = 0; i < this.td.length; i++) s += this.td[i] * this.td[i];
    const rms = Math.sqrt(s / this.td.length);
    this.an.getByteFrequencyData(this.fd);
    let logSum = 0, sum = 0, n = 0;
    for (let i = 2; i < 180; i++) { const v = this.fd[i] + 1; logSum += Math.log(v); sum += v; n++; }
    const flat = Math.exp(logSum / n) / (sum / n); // 0 tonal .. 1 noise
    if (rms < this.floor * 2.5) this.floor += (rms - this.floor) * 0.02;
    const gate = Math.max(0.04, this.floor * 4);
    const excess = Math.max(0, rms - gate);
    const flatK = flat > 0.32 ? 1 : flat > 0.2 ? 0.45 : 0.1;
    return Math.min(1, excess * 9 * flatK);
  }
};

let wind = 0, blowAccum = 0;
function micTick(dt) {
  const active = state === 'COMPLETE' || state === 'BLOWING';
  const target = active ? Mic.read() : 0;
  wind += (target - wind) * (target > wind ? 0.35 : 0.08);
  if (!active) { wind *= 0.9; return; }
  if (wind > 0.22) {
    if (state === 'COMPLETE') { state = 'BLOWING'; ui.hint.classList.remove('show'); }
    blowAccum += dt * wind;
    // roughly half a second of steady blowing per candle; a strong blow is faster
    while (blowAccum > 260) {
      blowAccum -= 260;
      const lit = flames.filter(f => !f.out);
      if (!lit.length) break;
      // the candle nearest the centre of the breath goes first, then outward
      lit.sort((a, b) => Math.abs(a.x - CX) - Math.abs(b.x - CX));
      extinguish(lit[0]);
    }
  } else {
    blowAccum = Math.max(0, blowAccum - dt * 0.15);
  }
}

function extinguish(fl) {
  if (fl.out) return;
  fl.out = true;
  sfx('blow');
  const from = fl.level;
  tween(420, e => { fl.level = from * (1 - e); }, ease.in)
    .then(() => { fl.level = 0; smokeWisp(fl.x, fl.y - 2); }, noop);
  if (flames.every(f => f.out)) afterBlow().catch(noop);
}

const FW_COLS = [

function explode(x, y, pal) {
  const n = RM ? 24 : SMALL ? 46 : 72;
  const ring = Math.random() < 0.35;
  const sp = Math.max(0.65, Math.min(1.3, S));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.06, 0.06);

    particles.push({ kind: 'ember', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(0.45, 0.8), c: pal[(Math.random() * pal.length) | 0], size: rand(1.2, 2.3), tw: Math.random() < 0.4, ph: rand(0, 6.28) });
  }
  particles.push({ kind: 'flash', x, y, life: 1, r: 70 * sp, c: pal[0] });

// returns true when the particle is finished
function drawFirework(p, step, t) {
  const c = fctx;
  c.save();
  c.globalCompositeOperation = 'lighter';
  if (p.kind === 'rocket') {
    p.p = Math.min(1, p.p + step / p.dur);
    const e = 1 - Math.pow(1 - p.p, 2.2);
    const px = p.x, py = p.y;
    p.x = p.sx + (p.tx - p.sx) * e + Math.sin(p.p * 18) * 1.2;
    p.y = p.sy + (p.ty - p.sy) * e;
    for (let k = 0; k < 2; k++) particles.push({ kind: 'trail', x: p.x + rand(-1, 1), y: p.y + rand(0, 3), vx: rand(-8, 8), vy: rand(10, 40), life: 1, decay: rand(1.6, 2.6), c: p.pal[1], size: rand(.8, 1.6) });
    c.strokeStyle = p.pal[1]; c.globalAlpha = .8; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(px, py); c.lineTo(p.x, p.y); c.stroke();
    const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 7);
    g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(1, 'rgba(255,220,160,0)');
    c.globalAlpha = 1; c.fillStyle = g;
    c.beginPath(); c.arc(p.x, p.y, 7, 0, 6.283); c.fill();
    c.restore();
    if (p.p >= 1) { explode(p.x, p.y, p.pal); return true; }
    return false;
  }
  if (p.kind === 'flash') {
    p.life -= step * 4;
    if (p.life <= 0) { c.restore(); return true; }
    const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(255,250,235,${0.55 * p.life})`);
    g.addColorStop(1, 'rgba(255,220,180,0)');
    c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
    c.restore();
    return false;
  }
  // ember / trail
  const drag = Math.pow(p.kind === 'ember' ? 0.25 : 0.4, step);
  p.vx *= drag; p.vy = p.vy * drag + (p.kind === 'ember' ? 70 : 20) * step;
  p.x += p.vx * step; p.y += p.vy * step;
  p.life -= step * p.decay;
  if (p.life <= 0) { c.restore(); return true; }
  let a = Math.min(1, p.life * 1.4);
  if (p.tw) a *= 0.55 + 0.45 * Math.sin(t * 0.03 + p.ph);
  c.globalAlpha = a;
  c.fillStyle = p.c;
  if (p.kind === 'ember') {
    c.strokeStyle = p.c; c.lineWidth = p.size * .8; c.globalAlpha = a * .45;
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); c.stroke();
    c.globalAlpha = a;
  }
  c.beginPath(); c.arc(p.x, p.y, p.size * (0.6 + 0.4 * p.life), 0, 6.283); c.fill();
  c.restore();
  return false;
}
async function fireworksShow() {

// Once the cake is lit it glides aside, a second spotlight clicks on over a
// covered portrait on an easel, the satin cover is pulled away, and the
// little lights on the frame switch on.
// ========================================
const PHOTO_KEY = 'birthdayCakePhoto';
const PT = {
  el: $('party'), beam: $('ppBeam'), glow: $('ppGlow'), stand: $('ppStand'), easel: $('ppEasel'),
  frame: $('ppFrame'), pic: $('ppPic'), img: $('ppImg'), empty: $('ppEmpty'), flash: $('ppFlash'),
  glare: $('ppGlare'), plaque: $('ppPlaque'), lights: $('ppLights'), cloth: $('ppCloth'), input: $('photoInput'),
  mode: 'side', W: 300, H: 375, left: 0, top: 0, cx: 0, cy: 0, cakeDx: 0, cakeK: 1,
  shift: 0, shown: false, revealed: false, clothP: 0, bulbs: [], motes: [], cl: null

// Wide screens: cake on the left, portrait on an easel filling the right.
// Upright phones and tablets: portrait hangs under the fairy lights, cake below.
function layoutParty() {
  const portrait = VH > VW;
  const lightsLow = VH * 0.035 + Math.min(VH * 0.085, 70) + 16;
  const half = 236 * S;
  let mode = 'top', W = 0, H = 0, cakeCx = VW / 2, k = 1, left = 0, top = 0;
  if (!portrait) {

    cakeCx = Math.max(half * k + 24, Math.min(VW * 0.36, VW * 0.56 - half * k));
    const regionL = cakeCx + half * k + 30, regionR = VW - 24;
    const tableY = BOARD_Y + 8 * S;

    W = Math.min(H / 1.25, (regionR - regionL) * 0.8, 480);
    if (W >= 130) {
      mode = 'side';
      H = W * 1.25;
      left = (regionL + regionR) / 2 - W / 2;
      top = tableY - H * 1.18;
    }
  }
  if (mode === 'top') {
    cakeCx = VW / 2;
    H = Math.max(180, Math.min(380, VH * 0.34));
    W = Math.min(H / 1.25, VW * 0.66); H = W * 1.25;
    top = Math.max(wireY(VW / 2), wireY(VW / 2 - W / 2), wireY(VW / 2 + W / 2)) + 24;
    k = Math.min(1, (BOARD_Y - (top + H + 18)) / (472 * S));
    if (k < 0.74) { k = 0.74; H = Math.max(140, BOARD_Y - 18 - 472 * S * k - top); W = H / 1.25; }

    PT.el.style.setProperty('--rh', Math.max(10, top - wireY(VW / 2)).toFixed(1) + 'px');
  }
  Object.assign(PT, { mode, W, H, left, top, cx: left + W / 2, cy: top + H / 2, cakeDx: cakeCx - VW / 2, cakeK: k });
  const el = PT.el;
  el.classList.toggle('side', mode === 'side');
  el.classList.toggle('top', mode === 'top');
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  el.style.setProperty('--pw', W.toFixed(1) + 'px');
  el.style.setProperty('--beamh', (top + H * 0.65).toFixed(1) + 'px');
  buildEasel(); buildFrameLights(); buildCloth();
}
// Moves (and on upright screens, shrinks) the cake, its title and its lights together.
function applyCakeShift(e) {
  const dx = PT.cakeDx * e, k = 1 + (PT.cakeK - 1) * e;
  const tf = `translateX(-50%) translateX(${dx.toFixed(2)}px) scale(${k.toFixed(4)})`;
  for (const n of [ui.scene, ui.textLayer]) { n.style.transformOrigin = `50% ${(600 * S).toFixed(1)}px`; n.style.transform = tf; }
  ui.spot.style.transform = `translateX(calc(-50% + ${dx.toFixed(2)}px))`;

function titleRoom() {

function buildEasel() {
  const svg = PT.easel, W = PT.W, H = PT.H;
  svg.textContent = '';
  const ew = W * 1.12, eh = H * 1.26;
  Object.assign(svg.style, { left: -0.06 * W + 'px', top: -0.08 * H + 'px', width: ew + 'px', height: eh + 'px' });
  svg.setAttribute('viewBox', `0 0 ${ew.toFixed(1)} ${eh.toFixed(1)}`);
  const df = el('defs', {}, svg);

  const t = W * 0.03;
  const leg = (x1, y1, x2, y2, fill, w) => {
    const a = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2, ox = Math.cos(a) * w / 2, oy = Math.sin(a) * w / 2;
    el('polygon', { points: `${x1 - ox},${y1 - oy} ${x1 + ox},${y1 + oy} ${x2 + ox},${y2 + oy} ${x2 - ox},${y2 - oy}`, fill }, svg);
  };
  leg(0.56 * W, 0.02 * H, 0.56 * W, eh - 0.035 * H, '#2a190d', t * 0.8);            // back leg
  leg(0.43 * W, 0, 0.14 * W, eh, 'url(#ppWood)', t);                                // front legs
  leg(0.69 * W, 0, 0.98 * W, eh, 'url(#ppWood)', t);
  el('rect', { x: 0.56 * W - t * 0.9, y: -0.01 * H, width: t * 1.8, height: 0.1 * H, rx: t * 0.3, fill: 'url(#ppWood)' }, svg);
  for (const fx of [0.14 * W, 0.98 * W]) el('ellipse', { cx: fx, cy: eh, rx: t * 1.4, ry: t * 0.35, fill: '#000', opacity: .45 }, svg);
}
function buildFrameLights() {
  const svg = PT.lights, W = PT.W, H = PT.H;
  svg.textContent = '';
  const lh = H * 0.24;
  Object.assign(svg.style, { top: -0.035 * H + 'px', width: W + 'px', height: lh + 'px' });
  svg.setAttribute('viewBox', `0 0 ${W.toFixed(1)} ${lh.toFixed(1)}`);
  const df = el('defs', {}, svg);
  const f = el('filter', { id: 'ppBulbBlur', x: '-100%', y: '-100%', width: '300%', height: '300%' }, df);
  el('feGaussianBlur', { stdDeviation: (W * 0.01).toFixed(2) }, f);
  const y0 = H * 0.03, sag = H * 0.075;
  const A = [-0.02 * W, y0], B = [0.5 * W, y0 + sag * 0.3], C = [1.02 * W, y0];
  const c1 = [0.24 * W, y0 + sag * 2], c2 = [0.76 * W, y0 + sag * 2];
  el('path', { d: `M${A} Q${c1} ${B} Q${c2} ${C}`, fill: 'none', stroke: 'rgba(60,46,30,.85)', 'stroke-width': Math.max(1, W * 0.004) }, svg);
  const q = (p0, p1, p2, t) => [(1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0], (1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1]];
  const cols = ['#ffcf7a', '#ffb3c9', '#aecdff', '#fff1d6'];
  PT.bulbs = [];
  const n = 12;
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n;
    const [x, y] = u < 0.5 ? q(A, c1, B, u * 2) : q(B, c2, C, (u - 0.5) * 2);
    const g = el('g', { class: 'pp-bulb' }, svg);
    const col = cols[i % cols.length];
    el('circle', { class: 'g', cx: x, cy: y + W * 0.012, r: W * 0.03, fill: col, filter: 'url(#ppBulbBlur)', style: `--d:${rand(1.8, 3.2).toFixed(2)}s;--dl:${rand(0, 2).toFixed(2)}s` }, g);
    el('rect', { x: x - W * 0.005, y: y - W * 0.002, width: W * 0.01, height: W * 0.008, fill: '#3c2f22' }, g);
    el('ellipse', { cx: x, cy: y + W * 0.012, rx: W * 0.0065, ry: W * 0.009, fill: col }, g);
    el('circle', { cx: x - W * 0.002, cy: y + W * 0.009, r: W * 0.0025, fill: '#fff', opacity: .85 }, g);
    PT.bulbs.push(g);
  }
}

// ----- the satin cover -----
function buildCloth() {
  const svg = PT.cloth, W = PT.W, H = PT.H;
  svg.textContent = '';
  Object.assign(svg.style, { width: W + 'px', height: H + 'px' });
  svg.setAttribute('viewBox', `0 0 ${W.toFixed(1)} ${H.toFixed(1)}`);
  const df = el('defs', {}, svg);
  linGrad('ppFold', [[0, '#4f1129'], [.07, '#7d2346'], [.13, '#5c1631'], [.22, '#94325a'], [.3, '#64193a'], [.4, '#9a3a62'],
    [.5, '#6a1c3e'], [.6, '#a14369'], [.7, '#6a1c3e'], [.8, '#952f58'], [.9, '#5e1734'], [1, '#3f0d22']], 0, 0, 1, 0, df);
  linGrad('ppClothShade', [[0, '#fff', .08], [.3, '#fff', 0], [1, '#000', .4]], 0, 0, 0, 1, df);
  const sh = el('linearGradient', { id: 'ppSheen', gradientUnits: 'userSpaceOnUse', x1: 0, y1: 0, x2: W * 0.5, y2: H * 0.25 }, df);
  [[0, 0], [.42, 0], [.5, .38], [.58, 0], [1, 0]].forEach(([o, a]) => el('stop', { offset: o, 'stop-color': '#ffe0ec', 'stop-opacity': a }, sh));
  PT.sheen = sh;
  sh.setAttribute('gradientTransform', `translate(${-2 * W},0)`);
  PT.cl = {
    g: el('g', {}, svg),
  };

  PT.cl.shade = el('path', { fill: 'url(#ppClothShade)' }, PT.cl.g);

  PT.cl.trim = el('polyline', { fill: 'none', stroke: '#d9b56a', 'stroke-width': Math.max(1.2, W * 0.007) }, PT.cl.g);
  PT.cl.fringe = el('polyline', { fill: 'none', stroke: '#e8c983', 'stroke-width': W * 0.035, 'stroke-dasharray': '1.4 2.2' }, PT.cl.g);

}
function curveThrough(pts, start) {
  let d = `${start}${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += ` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  const L = pts[pts.length - 1];
  return d + ` L${L[0].toFixed(1)},${L[1].toFixed(1)}`;
}
// p = 0: draped over the frame; p = 1: pulled off and gone.
function drawCloth(p) {
  if (!PT.cl) return;
  const W = PT.W, H = PT.H, n = 26, top = [], bot = [];
  for (let i = 0; i < n; i++) {
    const xr = i / (n - 1);
    const x0 = -0.045 * W + xr * 1.09 * W;
    const edge = Math.max(0, Math.abs(xr - 0.5) - 0.44) / 0.06;
    const top0 = -0.03 * H + edge * edge * 0.05 * H;
    const bot0 = 0.995 * H + Math.sin(xr * Math.PI * 7) * 0.006 * H;   // rests on the easel ledge
    const lag = 0.32 * (1 - xr);
    const q = Math.max(0, Math.min(1, (p - lag) / 0.68));
    const qe = q * q * (3 - 2 * q);
    const dx = -W * 0.7 * Math.pow(qe, 1.3);
    const dy = H * 0.5 * Math.pow(qe, 1.6);
    const wave = Math.sin(xr * 8 - p * 14) * W * 0.03 * Math.sin(Math.PI * q);
    const by = bot0 + dy * 0.6 + wave * 0.6;
    const ty = Math.min(top0 + dy + H * 0.8 * qe + wave, by - 4);
    top.push([x0 + dx + wave * 0.4, ty]);
    bot.push([x0 + dx * 1.08 + wave * 0.3, by]);
  }
  const d = curveThrough(top, 'M') + ' ' + curveThrough(bot.slice().reverse(), 'L') + ' Z';
  PT.cl.base.setAttribute('d', d);
  PT.cl.shade.setAttribute('d', d);
  PT.cl.sheen.setAttribute('d', d);
  PT.cl.trim.setAttribute('points', bot.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' '));
  PT.cl.fringe.setAttribute('points', bot.map(([x, y]) => `${x.toFixed(1)},${(y + W * 0.017).toFixed(1)}`).join(' '));
  PT.cl.g.setAttribute('opacity', p > 0.72 ? Math.max(0, 1 - (p - 0.72) / 0.28).toFixed(3) : 1);
}
function clothSheen(ms) {
  const W = PT.W;
  return tween(ms, e => PT.sheen.setAttribute('gradientTransform', `translate(${(-1.3 * W + 2.6 * W * e).toFixed(1)},0)`), ease.inOut);
}
function glareSweep() {
  PT.glare.animate(
    [{ backgroundPosition: '0 0, 100% 0' }, { backgroundPosition: '0 0, 0% 0' }],
    { duration: 1600, easing: 'cubic-bezier(.45,0,.25,1)' });
}
function partyBurst(small) {
  const n = small ? 28 : RM ? 24 : SMALL ? 50 : 80;
  const pal = ['#f3d38d', '#fff3cf', '#ffd98a', '#f7c6d0', '#c9e4f5', '#ffe9b8'];
  const W = PT.W * 1.04, H = PT.H * 1.04;
  for (let i = 0; i < n; i++) {
    const f = i / n * 2 * (W + H);
    let x, y;
    if (f < W) { x = -W / 2 + f; y = -H / 2; }
    else if (f < W + H) { x = W / 2; y = -H / 2 + (f - W); }
    else if (f < 2 * W + H) { x = W / 2 - (f - W - H); y = H / 2; }
    else { x = -W / 2; y = H / 2 - (f - 2 * W - H); }
    const a = Math.atan2(y, x) + rand(-.3, .3), v = rand(60, 150);
    particles.push({ kind: 'ember', x: PT.cx + x, y: PT.cy + y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
      life: 1, decay: rand(.5, .9), c: pal[(Math.random() * pal.length) | 0], size: rand(1, 2.2), tw: true, ph: rand(0, 6.28) });
  }
}
function lightsOn() {
  PT.bulbs.forEach((b, i) => {
    waapi(b, [{ opacity: 0 }, { opacity: 1, offset: .45 }, { opacity: .35, offset: .65 }, { opacity: 1 }],
      { duration: 520, delay: i * 120 }).then(() => { if (i % 3 === 0) sfx('tick'); }, noop);
  });
}

async function presentPortrait() {
  // 1. the cake glides aside to make room
  sfx('slide');
  await tween(2600, e => { PT.shift = e; applyCakeShift(e); }, ease.inOut);
  PT.shift = 1;
  // 2. a second spotlight clicks on over a covered portrait
  PT.el.classList.add('on');
  PT.shown = true;
  sfx('tick');
  waapi(PT.beam, [{ opacity: 0 }, { opacity: .9, offset: .12 }, { opacity: .15, offset: .2 }, { opacity: 1, offset: .32 },
    { opacity: .5, offset: .4 }, { opacity: 1 }], { duration: 1500, easing: 'linear' }).catch(noop);
  waapi(PT.glow, [{ opacity: 0 }, { opacity: 1 }], { duration: 1800 }).catch(noop);
  await waapi(PT.stand, [
    { opacity: 0, filter: 'brightness(.2)' }, { opacity: .7, offset: .15, filter: 'brightness(.5)' },
    { opacity: .3, offset: .22, filter: 'brightness(.3)' }, { opacity: 1, offset: .4, filter: 'brightness(.8)' },
    { opacity: 1, filter: 'brightness(1)' }
  ], { duration: 1700 });
  // 3. light ripples across the satin cover
  await clothSheen(1600);
  await wait(250);
  // 4. the cover is pulled away
  sfx('whoosh');
  waapi(PT.flash, [{ opacity: 0 }, { opacity: 0, offset: .25 }, { opacity: .85, offset: .45 }, { opacity: 0 }],
    { duration: 3000, easing: 'ease-out' }).catch(noop);
  await tween(2600, e => { PT.clothP = e; drawCloth(e); }, ease.lin);
  PT.clothP = 1; drawCloth(1);
  PT.revealed = true;
  PT.el.classList.add('revealed');
  sfx('chime'); sfx('sparkle');
  partyBurst(false);
  glareSweep();
  // 5. the little lights on the frame switch on one by one
  lightsOn();
  await wait(1200);
}

// Dust drifting in the portrait's spotlight.
function drawPartyFx(t, dt) {
  if (!PT.shown || PT.mode !== 'side' || RM) return;
  const step = Math.min(dt, 50) / 1000, c = fctx;
  if (PT.motes.length < 22 && Math.random() < .25) {
    const y = rand(PT.top * 0.12, PT.top - 4), spread = PT.W * (0.25 + 0.9 * y / PT.top);
    PT.motes.push({ x: PT.cx + rand(-1, 1) * spread, y, vx: rand(-5, 5), vy: rand(-4, 4), life: 1, s: rand(.6, 1.5), ph: rand(0, 6.28) });
  }
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = PT.motes.length - 1; i >= 0; i--) {
    const m = PT.motes[i];
    m.x += (m.vx + Math.sin(t * .001 + m.ph) * 3) * step; m.y += m.vy * step;
    m.life -= step * 0.12;
    if (m.life <= 0) { PT.motes.splice(i, 1); continue; }
    c.globalAlpha = Math.sin(Math.PI * m.life) * 0.45;
    c.fillStyle = '#ffeacc';
    c.beginPath(); c.arc(m.x, m.y, m.s, 0, 6.283); c.fill();
  }
  c.restore();
}

// ----- the photo itself -----
function applyPhoto(src) {
  return new Promise(res => {
    const im = PT.img;
    im.onload = () => {
      im.onload = im.onerror = null;
      im.hidden = false; PT.empty.hidden = true;
      PT.pic.setAttribute('aria-label', 'Birthday photo');
      res(true);
    };
    im.onerror = () => { im.onload = im.onerror = null; console.warn('The birthday photo could not be loaded:', src); res(false); };
    im.src = src;
  });
}
async function swapPhoto(src) {
  try {
    await waapi(PT.flash, [{ opacity: 0 }, { opacity: .95 }], { duration: 600, easing: 'ease-in' });
    await applyPhoto(src);
    partyBurst(true);
    sfx('sparkle');
    await waapi(PT.flash, [{ opacity: .95 }, { opacity: 0 }], { duration: 1400, easing: 'ease-out' });
    glareSweep();
  } catch (e) { /* replay pressed meanwhile */ }
}
function loadImage(url) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
async function loadPhotoFile(file) {
  if (!file || !/^image\//.test(file.type)) return;
  const url = URL.createObjectURL(file);
  try {
    const im = await loadImage(url);
    const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));   // keep it light
    const c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k);
    c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.9);
    if (PT.revealed) swapPhoto(data); else applyPhoto(data);
    try { localStorage.setItem(PHOTO_KEY, data); } catch (e) { /* remembering is optional */ }
  } catch (e) {
    console.warn('That file could not be opened as an image.', e);
  } finally {
    URL.revokeObjectURL(url);
  }
}
PT.pic.addEventListener('click', e => { e.stopPropagation(); });
PT.input.addEventListener('change', () => {
  const f = PT.input.files && PT.input.files[0];
  if (f) loadPhotoFile(f);
  PT.input.value = '';
});
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {

});

// ========================================
// BIRTHDAY GIFT
// After the wish a wrapped gift slides onto the table, its bow unties, the lid
// pops off, light pours out and balloons float up out of it.
// ========================================
const GBOX = { w: 100, h: 80, d: 75, kx: -0.25, ky: -0.32 };       // box in its own units
const P3 = (x, y, z) => [x + GBOX.kx * z, -y + GBOX.ky * z];        // simple oblique projection
const pts = (...ps) => ps.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
const GF = {
  el: $('gift'), back: $('giftBack'), front: $('giftFront'), lid: $('giftLid'),
  mode: 'side', k: 1, left: 0, top: 0, O: { x: 0, y: 0 },
  present: false, opened: false, openP: null, raysOn: false, motes: []
};
const BAL = [];
const GLOW = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,242,210,1)');
  gr.addColorStop(.3, 'rgba(255,214,150,.5)');
  gr.addColorStop(1, 'rgba(255,190,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  return c;
})();

function buildGift() {
  const { d } = GBOX, z1 = d / 2 - 6.5, z2 = d / 2 + 6.5;
  const mk = (svgEl, tag, attrs, parent) => el(tag, attrs, parent || svgEl);
  // shared paint (each layer gets its own defs so ids resolve inside it)
  const paints = (svgEl, pre) => {
    const df = el('defs', {}, svgEl);
    const lin = (id, stops, x2 = 1, y2 = 0) => linGrad(pre + id, stops, 0, 0, x2, y2, df);
    lin('ribbon', [[0, '#8a6526'], [.32, '#f6dc98'], [.52, '#c39a45'], [.7, '#fff1c4'], [1, '#a07a30']]);
    const pat = el('pattern', { id: pre + 'dots', width: 9, height: 9, patternUnits: 'userSpaceOnUse' }, df);
    el('circle', { cx: 2, cy: 2, r: .85, fill: '#f3d38d', opacity: .55 }, pat);
    el('circle', { cx: 6.5, cy: 6.5, r: .55, fill: '#f7e1a1', opacity: .45 }, pat);
    const bl = el('filter', { id: pre + 'blur', x: '-50%', y: '-50%', width: '200%', height: '200%' }, df);
    el('feGaussianBlur', { stdDeviation: 2.4 }, bl);
    return { df, lin, R: `url(#${pre}ribbon)`, D: `url(#${pre}dots)`, B: `url(#${pre}blur)` };
  };
  // ----- back layer: shadow, left side, opening, light -----
  const b = GF.back; b.textContent = '';
  const pb = paints(b, 'gb');
  pb.lin('left', [[0, '#3f1124'], [1, '#6a2340']]);
  radGrad('gbInner', [[0, '#3a1420'], [1, '#12060b']], .5, .5, .6, pb.df);
  radGrad('gbInnerLit', [[0, '#fff1c8'], [.35, '#ffc670'], [1, '#c4562a', 0]], .5, .5, .6, pb.df);
  const O = P3(50, 80, d / 2);
  const rg = el('radialGradient', { id: 'gbRay', gradientUnits: 'userSpaceOnUse', cx: O[0], cy: O[1], r: 280 }, pb.df);
  [[0, '#fff0c8', .75], [.35, '#ffd28a', .3], [1, '#ffb060', 0]].forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, rg));
  el('ellipse', { cx: P3(50, 0, d / 2)[0], cy: -6, rx: 74, ry: 15, fill: '#000', opacity: .55, filter: pb.B }, b);
  const leftF = pts(P3(0, 0, 0), P3(0, 0, d), P3(0, 80, d), P3(0, 80, 0));
  el('polygon', { points: leftF, fill: 'url(#gbleft)' }, b);
  el('polygon', { points: leftF, fill: pb.D }, b);
  el('polygon', { points: leftF, fill: '#ff9a4a', opacity: .16, style: 'mix-blend-mode:screen' }, b);   // candlelight
  GF.ribL = el('polygon', { points: pts(P3(0, 0, z1), P3(0, 0, z2), P3(0, 70, z2), P3(0, 70, z1)), fill: pb.R }, b);
  const openF = pts(P3(0, 80, 0), P3(100, 80, 0), P3(100, 80, d), P3(0, 80, d));
  el('polygon', { points: openF, fill: 'url(#gbInner)' }, b);
  GF.lit = el('polygon', { points: openF, fill: 'url(#gbInnerLit)', opacity: 0 }, b);
  GF.rays = el('g', { id: 'giftRays', opacity: 0 }, b);
  const sway = el('g', { class: 'rays-sway', filter: pb.B }, GF.rays);
  for (const a of [-50, -33, -17, 0, 17, 33, 50]) {
    const L = a === 0 ? 290 : 250 - Math.abs(a);

function layoutGift() {
  let boxW, frontLeft, frontBottom;
  if (PT.mode === 'side') {
    const boardRight = VW / 2 + PT.cakeDx + 236 * S * PT.cakeK;
    const gap = PT.left - boardRight;
    boxW = Math.max(70, Math.min(120, VH * 0.15, gap + 40));
    const k = boxW / 100;
    frontLeft = (boardRight + PT.left) / 2 - 40 * k;
    frontBottom = BOARD_Y + 34 * S;
    GF.mode = 'side';
  } else {
    boxW = Math.min(130, VW * 0.24, VH * 0.14);
    const k = boxW / 100;
    frontLeft = VW - 100 * k * 0.86;
    frontBottom = Math.max(BOARD_Y + 14, Math.min(VH - 96, BOARD_Y + 120));
    GF.mode = 'top';
  }
  const k = boxW / 100;
  GF.k = k;
  GF.left = frontLeft - 30 * k;
  GF.top = frontBottom - 135 * k;
  GF.O = { x: 70.6 * k, y: 43 * k };          // centre of the box opening
  GF.el.style.left = GF.left + 'px';
  GF.el.style.top = GF.top + 'px';
  GF.el.style.setProperty('--gs', (145 * k).toFixed(1) + 'px');
}
// WAAPI helper for the gift: durations follow the scene's pacing; cancelled by Replay.
function waapi(node, frames, opts = {}) {
  const my = RUN;
  const a = node.animate(frames, { fill: 'forwards', easing: 'ease', ...opts, duration: T(opts.duration || 600), delay: T(opts.delay || 0) });
  return a.finished.then(() => { if (my !== RUN) throw CANCEL; }, () => { throw CANCEL; });
}
const giftOrigin = () => { GF.el.style.transformOrigin = `${80 * GF.k}px ${135 * GF.k}px`; };

      c: ['#f3d38d', '#fff3cf', '#ffd98a'][i % 3], size: rand(.9, 1.6), tw: true, ph: rand(0, 6.28) });
  }
}
function giftBurst() {

function releaseBalloons() {
  const cols = [['#f7d58f', '#b98a32'], ['#f6b3c6', '#c0607f'], ['#fbf3e6', '#c9b593'], ['#c9b2f2', '#7e63b8'], ['#e8657f', '#9e2c47'], ['#a7d3f2', '#4f88b5']];
  const n = RM ? 3 : 6, base = Math.max(0.7, Math.min(1.35, VH / 800)), off = (Math.random() * cols.length) | 0;
  for (let i = 0; i < n; i++) {
    BAL.push({ x: rand(-22, 22) * GF.k, y: 0, vy: 0, acc: rand(50, 75) * base, max: rand(65, 105) * base,
      r: rand(16, 23) * base, c: cols[(i + off) % cols.length], ph: rand(0, 6.28), sw: rand(12, 24),
      delay: i * rand(.2, .34), t: 0, len: rand(55, 85) * base, drift: rand(-0.12, 0.12) });
  }
}
function drawBalloons(t, step) {
  if (!BAL.length) return;
  const c = fctx, ox = GF.left + GF.O.x, oy = GF.top + GF.O.y;
  c.save();
  for (let i = BAL.length - 1; i >= 0; i--) {
    const b = BAL[i];
    b.t += step;
    if (b.t < b.delay) continue;
    b.vy = Math.min(b.max, b.vy + b.acc * step);
    b.y -= b.vy * step;
    const age = b.t - b.delay;
    const sway = Math.sin(t * 0.0016 + b.ph) * b.sw * Math.min(1, age * 1.2);
    const x = ox + b.x + sway - b.y * b.drift, y = oy + b.y - b.r * 1.3;
    if (y < -b.r * 3 - b.len) { BAL.splice(i, 1); continue; }
    const a = Math.min(1, age * 3), ky = b.r * 1.18;
    const wob = Math.sin(t * 0.003 + b.ph) * 6;
    c.globalAlpha = a * 0.55;
    c.strokeStyle = 'rgba(240,230,220,.9)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, y + ky + b.r * .12);
    c.bezierCurveTo(x + wob, y + ky + b.len * .35, x - wob, y + ky + b.len * .7, x + wob * .5, y + ky + b.len);
    c.stroke();
    c.save();
    c.translate(x, y); c.rotate(sway * 0.008);
    c.globalAlpha = a;
    const g = c.createRadialGradient(-b.r * .35, -b.r * .45, b.r * .08, 0, 0, b.r * 1.3);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.2, b.c[0]); g.addColorStop(1, b.c[1]);
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, b.r, ky, 0, 0, 6.283); c.fill();
    c.fillStyle = b.c[1];
    c.beginPath(); c.moveTo(-b.r * .13, ky + b.r * .17); c.lineTo(b.r * .13, ky + b.r * .17); c.lineTo(0, ky - b.r * .04); c.closePath(); c.fill();
    c.globalAlpha = a * .5; c.fillStyle = '#ffffff';
    c.beginPath(); c.ellipse(-b.r * .38, -b.r * .5, b.r * .14, b.r * .26, -.5, 0, 6.283); c.fill();
    c.restore();
  }
  c.restore();
}

    waapi(GF.ribL, [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(6px)' }], { duration: 900 }).catch(noop);
    waapi(GF.seam, [{ opacity: 1 }, { opacity: 0 }], { duration: 500 }).catch(noop);
    GF.lid.style.transformOrigin = `${70.6 * GF.k}px ${32 * GF.k}px`;
    const bw = 100 * GF.k;
    waapi(GF.lid, [
      { transform: 'translate(0,0) rotate(0deg)', opacity: 1, easing: 'cubic-bezier(.2,.8,.3,1)' },
      { transform: `translate(${bw * .08}px,${-bw * .85}px) rotate(-16deg)`, opacity: 1, offset: .32, easing: 'ease-in-out' },
      { transform: `translate(${bw * .9}px,${-bw * 2.2}px) rotate(32deg)`, opacity: 0 }
    ], { duration: 2600 }).catch(noop);

async function dropLetter() {

    width: 62 * k + 'px', height: 42 * k + 'px',

// tap the envelope: the flap lifts, the paper slides up, then the letter opens over the scene
async function openLetter() {
  if (LT.opened || !LT.env.classList.contains('ready')) return;
  LT.opened = true;
  if (LT.bob) { LT.bob.cancel(); LT.bob = null; }
  LT.env.classList.remove('ready');
  LT.env.classList.add('open');
  document.body.classList.add('reading');
  sfx('pop');
  await wait(1100);
  LT.letter.classList.add('on');
  sfx('chime');
}

function closeLetter() {
  if (!LT.opened) return;
  LT.letter.classList.remove('on');
  document.body.classList.remove('reading');
  LT.env.classList.remove('open');
  LT.env.classList.add('ready');
  LT.opened = false;
  bobLetter();
}

LT.close.addEventListener('click', e => { e.stopPropagation(); closeLetter(); });
LT.letter.addEventListener('click', e => { if (e.target === LT.letter) closeLetter(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && LT.letter.classList.contains('on')) closeLetter(); });
LT.env.addEventListener('click', e => { e.stopPropagation(); openLetter().catch(noop); });
LT.env.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter().catch(noop); }
});

function drawGiftFx(t, dt) {
  const step = Math.min(dt, 50) / 1000;
  drawBalloons(t, step);
  if (!GF.raysOn) return;
  if (!RM && GF.motes.length < 24 && Math.random() < .3) {
    GF.motes.push({ x: rand(-26, 26) * GF.k, y: 0, vx: rand(-6, 6), vy: -rand(20, 44), life: 1, ph: rand(0, 6.28), s: rand(1, 2.3) });
  }
  const c = fctx, ox = GF.left + GF.O.x, oy = GF.top + GF.O.y;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = GF.motes.length - 1; i >= 0; i--) {
    const m = GF.motes[i];
    m.x += (m.vx + Math.sin(t * .002 + m.ph) * 8) * step;
    m.y += m.vy * step;
    m.life -= step * .9;
    if (m.life <= 0) { GF.motes.splice(i, 1); continue; }
    const s = m.s * 5;
    c.globalAlpha = Math.sin(Math.PI * m.life) * .8;
    c.drawImage(GLOW, ox + m.x - s / 2, oy + m.y - s / 2, s, s);
  }
  c.restore();
}
