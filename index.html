function resetScene() {
  RUN++;
  document.getAnimations().forEach(a => {
    const t = a.effect && a.effect.target;
    if (t && t.closest && (t.closest('svg') || t.closest('.title') || t.closest('.gift') || t.closest('.party'))) a.cancel();
  });
  PT.el.classList.remove('on', 'revealed');
  Object.assign(PT, { shown: false, revealed: false, shift: 0, clothP: 0, motes: [] });
  applyCakeShift(0);
  drawCloth(0);
  if (PT.sheen) PT.sheen.setAttribute('gradientTransform', `translate(${-2 * PT.W},0)`);
  GF.el.classList.remove('on', 'open');
  LT.letter.classList.remove('on');
  LT.opened = false; LT.bob = null;
  document.body.classList.remove('reading');
  Object.assign(GF, { present: false, opened: false, openP: null, raysOn: false, motes: [] });
  BAL.length = 0;
  for (const k of ['ground', 'board', 'bottom', 'ring', 'dowel', 'top', 'decor', 'surface', 'light', 'fx', 'tools']) L[k].textContent = '';
  dyn.textContent = '';
  flames.length = 0;
  for (const k in S_) delete S_[k];
  for (let i = particles.length - 1; i >= 0; i--) if (!particles[i].ambient) particles.splice(i, 1);
  warmLevel = 0;
  wind = 0;
  blowAccum = 0;
  ui.warm.style.opacity = 0;
  ui.dim.style.opacity = '0';
  ui.title.textContent = '';
  ui.title.classList.remove('shimmer');
  ui.wish.classList.remove('show');
  ui.hint.classList.remove('show');
  state = 'EMPTY';
}

const steps = [
  buildCakeBoard, buildBottomSponge1, addBottomFilling, addBottomSponge2,
  frostBottomTier, addBottomGanache, addDowels, buildTopTier,
  addDecorations, addToppings, addCandles, lightCandles, presentPortrait, celebration
];
async function runSequence() {
  resetScene();
  const my = RUN;
  state = 'BUILDING';
  try {
    await wait(700);
    for (const step of steps) {
      if (my !== RUN) return;
      await step();
    }
    if (my !== RUN) return;
    state = 'COMPLETE';
    blowAccum = 0;
    updateHint();
    startIdle();
  } catch (err) {
    if (err !== CANCEL) console.error(err);
  }
}
ui.replay.addEventListener('click', e => { e.stopPropagation(); runSequence(); ui.replay.blur(); });

// ========================================
// DART GAME (front page)
// Five darts. The first four always land somewhere on the board (never the
// bull), the fifth always finds the bullseye. Then 3-2-1 and the cake page.
// ========================================
const DP = {
  page: $('dartPage'), board: $('dpBoard'), wrap: $('dpBoardWrap'), msg: $('dpMsg'),
  darts: $('dpDarts'), bull: $('dpBull'), cd: $('countdown'), cdNum: $('cdNum'), curtain: $('curtain'),
  layer: null, aim: null, pulse: null, thrown: 0, busy: false, done: false, lines: []
};
const DART_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const FLIGHTS = ['#f28aa8', '#f3d38d', '#8fd3c8', '#c9a8ff', '#e8657f'];
const WHO = NAME || 'birthday star';
const MISS_LINES = [
  `heyyy heyyyy 😂`,
  `ohhhhhh so close`,
  `waittt that was almost it`,
  `hahaha okayyy`,
  `ayyy you're actually pretty good at this`,
  `okayyy nice aim! 😭`,
  `oooohhh missed it 😭`
];
const LAST_LINE = `Last dart, ${WHO}! Close your eyes, make a wish… and throw 🌠`;
const BULL_LINE = `BULLSEYE! 🎯 Of course. ${NAME || 'The birthday star'} never misses ✨`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// --- drawing the board ---
const polar = (r, deg) => [r * Math.sin(deg * Math.PI / 180), -r * Math.cos(deg * Math.PI / 180)];
function sector(r1, r2, a1, a2) {
  const [x1, y1] = polar(r2, a1), [x2, y2] = polar(r2, a2), [x3, y3] = polar(r1, a2), [x4, y4] = polar(r1, a1);
  return `M${x1.toFixed(2)},${y1.toFixed(2)} A${r2},${r2} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${r1},${r1} 0 0 0 ${x4.toFixed(2)},${y4.toFixed(2)}Z`;
}
function dartShape(parent, flight) {
  const g = el('g', {}, parent);
  el('polygon', { points: '0,0 -1.7,6 -1.7,16 1.7,16 1.7,6', fill: 'url(#dpSteel)' }, g);
  el('rect', { x: -4.2, y: 16, width: 8.4, height: 30, rx: 3, fill: 'url(#dpSteel)' }, g);
  for (let y = 20; y < 44; y += 3.2) el('line', { x1: -4, y1: y, x2: 4, y2: y + 1, stroke: 'rgba(40,44,52,.45)', 'stroke-width': .8 }, g);
  el('rect', { x: -2, y: 46, width: 4, height: 24, fill: '#2b2d33' }, g);
  el('path', { d: 'M0,60 L-13,84 L-10,97 L0,90 L10,97 L13,84Z', fill: flight, stroke: 'rgba(0,0,0,.35)', 'stroke-width': .8 }, g);
  el('path', { d: 'M0,60 L0,90', stroke: 'rgba(255,255,255,.55)', 'stroke-width': 1.2 }, g);
  el('path', { d: 'M0,62 L-8,80', stroke: 'rgba(255,255,255,.4)', 'stroke-width': 1 }, g);
  return g;
}
function buildDartboard() {
  const b = DP.board;
  b.textContent = '';
  const df = el('defs', {}, b);
  radGrad('dpSurround', [[0, '#1d1d1f'], [.86, '#151517'], [1, '#09090a']], .5, .5, .5, df);
  radGrad('dpLight', [[0, '#fff', .16], [.55, '#fff', .03], [1, '#000', .35]], .5, .3, .75, df);
  linGrad('dpSteel', [[0, '#5d636c'], [.35, '#e9edf2'], [.55, '#ffffff'], [.8, '#9aa1aa'], [1, '#4d535b']], 0, 0, 1, 0, df);
  linGrad('dpRim', [[0, '#6b6f75'], [.5, '#c9ccd1'], [1, '#55595f']], 0, 0, 0, 1, df);
  el('circle', { cx: 0, cy: 0, r: 234, fill: 'url(#dpSurround)', stroke: 'url(#dpRim)', 'stroke-width': 5 }, b);
  // numbers
  DART_ORDER.forEach((n, i) => {
    const [x, y] = polar(201, i * 18);
    const t = el('text', { x: x.toFixed(1), y: (y + 7).toFixed(1), 'text-anchor': 'middle', fill: '#ece2c8',
      'font-family': 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif', 'font-weight': 700, 'font-size': 21 }, b);
    t.textContent = n;
  });
  // segments
  const BLACK = '#1b1a1c', CREAM = '#efe3c6', RED = '#c3312c', GREEN = '#1f7a45';
  for (let i = 0; i < 20; i++) {
    const a1 = i * 18 - 9, a2 = i * 18 + 9, dark = i % 2 === 0;
    el('path', { d: sector(16, 99, a1, a2), fill: dark ? BLACK : CREAM }, b);
    el('path', { d: sector(99, 107, a1, a2), fill: dark ? RED : GREEN }, b);
    el('path', { d: sector(107, 162, a1, a2), fill: dark ? BLACK : CREAM }, b);
    el('path', { d: sector(162, 170, a1, a2), fill: dark ? RED : GREEN }, b);
  }
  el('circle', { cx: 0, cy: 0, r: 16, fill: GREEN }, b);
  el('circle', { cx: 0, cy: 0, r: 6.35, fill: RED }, b);
  // wire spider
  const wire = el('g', { stroke: '#cfd2d6', 'stroke-width': .9, fill: 'none', opacity: .7 }, b);
  for (let i = 0; i < 20; i++) {
    const [x1, y1] = polar(16, i * 18 - 9), [x2, y2] = polar(170, i * 18 - 9);
    el('line', { x1, y1, x2, y2 }, wire);
  }
  for (const r of [6.35, 16, 99, 107, 162, 170]) el('circle', { cx: 0, cy: 0, r }, wire);
  // soft overhead light
  el('circle', { cx: 0, cy: 0, r: 234, fill: 'url(#dpLight)', 'pointer-events': 'none' }, b);
  // gentle pulse on the bull, darts layer, aim marker
  DP.pulse = el('circle', { class: 'dp-pulse', cx: 0, cy: 0, r: 16, fill: 'none', stroke: '#f3d38d', 'stroke-width': 2 }, b);
  DP.layer = el('g', {}, b);
  DP.aim = el('g', { opacity: 0, 'pointer-events': 'none' }, b);
  el('circle', { cx: 0, cy: 0, r: 11, fill: 'none', stroke: '#f3d38d', 'stroke-width': 1.6 }, DP.aim);
  for (const [x1, y1, x2, y2] of [[-17, 0, -6, 0], [6, 0, 17, 0], [0, -17, 0, -6], [0, 6, 0, 17]]) el('line', { x1, y1, x2, y2, stroke: '#f3d38d', 'stroke-width': 1.4 }, DP.aim);
  // dart counter
  DP.darts.textContent = '';
  FLIGHTS.forEach(c => {
    const s = el('svg', { viewBox: '-16 -4 32 104', 'aria-hidden': 'true' }, DP.darts);
    s.style.transform = 'rotate(35deg)';
    const d2 = el('defs', {}, s);
    linGrad('dpSteel', [[0, '#5d636c'], [.5, '#ffffff'], [1, '#4d535b']], 0, 0, 1, 0, d2);
    dartShape(s, c);
  });
}

// --- geometry helpers ---
function toBoard(clientX, clientY) {
  const r = DP.board.getBoundingClientRect();
  return [(clientX - r.left) / r.width * 480 - 240, (clientY - r.top) / r.height * 480 - 240];
}
function toScreen(bx, by) {
  const r = DP.board.getBoundingClientRect();
  return [r.left + (bx + 240) / 480 * r.width, r.top + (by + 240) / 480 * r.height];
}
function scoreAt(x, y) {
  const r = Math.hypot(x, y);
  if (r <= 6.35) return 'Bull · 50';
  if (r <= 16) return '25';
  if (r > 170) return 'Miss';
  const ang = (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360;
  const v = DART_ORDER[Math.floor(((ang + 9) % 360) / 18)];
  if (r >= 99 && r <= 107) return `Triple ${v}`;
  if (r >= 162) return `Double ${v}`;
  return `${v}`;
}
function setMsg(text) {
  DP.msg.textContent = text;
  DP.msg.animate([{ opacity: 0, transform: 'translateY(6px) scale(.96)' }, { opacity: 1, transform: 'translateY(0) scale(1)' }],
    { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1.2)' });
}

// --- throwing ---
function flyDart(hx, hy, flight, magic, tx, ty) {
  const g = dartShape(DP.layer, flight);
  const sx = tx * 0.25, sy = 560;
  const cx = magic ? tx : (sx + hx) / 2, cy = magic ? ty - 40 : Math.min(sy, hy) - 150;
  const dur = magic ? 620 : 460;
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 2), u = 1 - e;
      const x = u * u * sx + 2 * u * e * cx + e * e * hx;
      const y = u * u * sy + 2 * u * e * cy + e * e * hy;
      const s = 2.7 - 1.8 * ease.out(k);
      g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-12 * k).toFixed(2)}) scale(${s.toFixed(3)},${(s * (1 - .3 * k)).toFixed(3)})`);
      if (magic && k < 1) {
        const [px, py] = toScreen(x, y);
        particles.push({ kind: 'trail', x: px, y: py, vx: rand(-10, 10), vy: rand(-10, 10), life: 1, decay: rand(1.4, 2.2), c: '#ffd98a', size: rand(1, 2) });
      }
      if (k < 1) requestAnimationFrame(step); else res(g);
    };
    requestAnimationFrame(step);
  });
}
function stick(g, hx, hy) {
  const sh = el('ellipse', { cx: hx + 5, cy: hy + 13, rx: 7, ry: 3, fill: '#000', opacity: .35 }, DP.layer);
  DP.layer.insertBefore(sh, g);
  const t0 = performance.now();
  const step = now => {
    const t = (now - t0) / 1000;
    const rot = -12 + 7 * Math.sin(t * 38) * Math.exp(-t * 7);
    g.setAttribute('transform', `translate(${hx.toFixed(1)},${hy.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(1.05,.72)`);
    if (t < .7) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  DP.wrap.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(1px,2px)' }, { transform: 'translate(-1px,0)' }, { transform: 'translate(0,0)' }], { duration: 220 });
  const [px, py] = toScreen(hx, hy);
  for (let i = 0; i < 7; i++) {
    particles.push({ kind: 'ember', x: px, y: py, vx: rand(-60, 60), vy: rand(-80, -10), life: 1, decay: rand(1.4, 2.2),
      c: i % 2 ? '#d8cbb0' : '#f3d38d', size: rand(.8, 1.5), tw: false, ph: 0 });
  }
  // score pops up from the hit
  const label = el('text', { x: hx.toFixed(1), y: (hy - 18).toFixed(1), 'text-anchor': 'middle', fill: '#fff3cf',
    'font-family': 'ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif', 'font-weight': 700, 'font-size': 18,
    stroke: 'rgba(0,0,0,.55)', 'stroke-width': 3, 'paint-order': 'stroke' }, DP.board);
  label.textContent = scoreAt(hx, hy);
  label.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)', offset: .2 }, { opacity: 0, transform: 'translateY(-26px)' }],
    { duration: 1300, easing: 'ease-out' }).finished.then(() => label.remove(), () => label.remove());
}
async function throwDart(tx, ty) {
  if (DP.busy || DP.done || DP.thrown >= 5) return;
  DP.busy = true;
  if (Mic.state === 'off') Mic.start();            // ask for the microphone now, ready for the candles later
  const n = ++DP.thrown, last = n === 5;
  DP.darts.children[n - 1].classList.add('used');
  DP.darts.setAttribute('aria-label', `${5 - n} dart${5 - n === 1 ? '' : 's'} left`);
  DP.aim.setAttribute('opacity', 0);
  let hx, hy;
  if (last) {
    hx = rand(-2.5, 2.5); hy = rand(-2.5, 2.5);       // dart five always finds the bull
  } else {
    let r = Math.hypot(tx, ty), a = Math.atan2(ty, tx);
    if (r < 1) a = rand(0, 6.283);
    if (r < 34) r = rand(38, 75);                       // the bull is saving itself for dart five
    r = Math.max(30, Math.min(158, r + rand(-8, 8)));
    a += rand(-0.08, 0.08);
    hx = r * Math.cos(a); hy = r * Math.sin(a);
  }
  sfx('whoosh');
  const g = await flyDart(hx, hy, FLIGHTS[n - 1], last, tx, ty);
  sfx('thunk');
  stick(g, hx, hy);
  if (last) { await bullseye(); return; }
  if (n === 4) setMsg(LAST_LINE);
  else setMsg(DP.lines.pop());
  DP.busy = false;
}

async function bullseye() {
  DP.done = true;
  DP.pulse.remove();
  sfx('boom'); sfx('chime'); sfx('sparkle');
  for (let i = 0; i < 3; i++) {
    const c = el('circle', { cx: 0, cy: 0, r: 16, fill: 'none', stroke: '#ffd98a', 'stroke-width': 4 }, DP.board);
    c.animate([{ r: 16, opacity: 1, strokeWidth: 5 }, { r: 260, opacity: 0, strokeWidth: 1 }],
      { duration: 1300, delay: i * 220, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' }).finished.then(() => c.remove(), () => c.remove());
  }
  const flash = el('circle', { cx: 0, cy: 0, r: 175, fill: '#fff6e0', opacity: 0, 'pointer-events': 'none' }, DP.board);
  flash.animate([{ opacity: .55 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' }).finished.then(() => flash.remove(), () => flash.remove());
  const [bx, by] = toScreen(0, 0);
  const pal = ['#f3d38d', '#fff3cf', '#ffb24a', '#f7c6d0', '#c9e4f5', '#a8f0c8', '#c9a8ff'];
  for (let i = 0; i < (SMALL ? 60 : 110); i++) {
    const a = rand(0, 6.283), v = rand(60, 320);
    particles.push({ kind: 'ember', x: bx, y: by, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 1, decay: rand(.45, .85),
      c: pal[(Math.random() * pal.length) | 0], size: rand(1.2, 2.6), tw: Math.random() < .5, ph: rand(0, 6.28) });
  }
  emitCelebration();
  DP.bull.animate([
    { opacity: 0, transform: 'translate(-50%,-50%) scale(.3) rotate(-8deg)' },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1.15) rotate(2deg)', offset: .55 },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', offset: .75 },
    { opacity: 1, transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', offset: .9 },
    { opacity: 0, transform: 'translate(-50%,-50%) scale(1.06) rotate(0deg)' }
  ], { duration: 2300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  setMsg(BULL_LINE);
  await sleep(2100);
  await countdown();
  await zoomToCake();
}
async function countdown() {
  DP.cd.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, fill: 'forwards' });
  await sleep(350);
  for (const n of ['3', '2', '1']) {
    DP.cdNum.textContent = n;
    sfx('beep');
    DP.cdNum.animate([
      { opacity: 0, transform: 'scale(1.8)', filter: 'blur(10px)' },
      { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)', offset: .3 },
      { opacity: 1, transform: 'scale(.94)', filter: 'blur(0px)', offset: .72 },
      { opacity: 0, transform: 'scale(.6)', filter: 'blur(6px)' }
    ], { duration: 950, easing: 'ease-out', fill: 'forwards' });
    await sleep(950);
  }
  sfx('go');
  DP.cd.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' });
}
async function zoomToCake() {
  // fly into the bullseye, through to the cake room
  DP.wrap.style.filter = 'none';
  for (const n of DP.page.querySelectorAll('.dp-head, .dp-info')) n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
  DP.wrap.animate([{ transform: 'scale(1)' }, { transform: 'scale(14)' }], { duration: 1300, easing: 'cubic-bezier(.6,0,.85,.35)', fill: 'forwards' });
  DP.curtain.animate([{ opacity: 0 }, { opacity: 0, offset: .45 }, { opacity: 1 }], { duration: 1300, fill: 'forwards' });
  await sleep(1350);
  DP.page.classList.add('gone');
  document.body.classList.remove('darts');
  runSequence();
  DP.curtain.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1600, easing: 'ease-out', fill: 'forwards' });
}

function startDarts() {
  document.body.classList.add('darts');
  buildDartboard();
  DP.lines = MISS_LINES.slice().sort(() => Math.random() - 0.5);
  DP.page.querySelector('.dp-head').animate([{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 900, easing: 'ease-out' });
  DP.wrap.animate([{ opacity: 0, transform: 'scale(.85) rotate(-20deg)' }, { opacity: 1, transform: 'scale(1) rotate(0deg)' }], { duration: 1100, easing: 'cubic-bezier(.2,.8,.2,1)' });
  DP.page.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    const [x, y] = toBoard(e.clientX, e.clientY);
    throwDart(x, y);
  });
  DP.page.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || DP.busy || DP.done) return;
    const [x, y] = toBoard(e.clientX, e.clientY);
    const r = Math.hypot(x, y), k = r > 165 ? 165 / r : 1;
    DP.aim.setAttribute('transform', `translate(${(x * k).toFixed(1)},${(y * k).toFixed(1)})`);
    DP.aim.setAttribute('opacity', 1);
  });
  DP.page.addEventListener('pointerleave', () => DP.aim.setAttribute('opacity', 0));
  DP.board.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); throwDart(rand(-60, 60), rand(-60, 60)); }
  });
}

// ========================================
// MAIN LOOP & START
// ========================================
let last = performance.now();
function frame(t) {
  const dt = t - last; last = t;
  drawBackground(t);
  micTick(Math.min(dt, 60));
  flickerLoop(t);
  drawFx(t, dt);
  drawPartyFx(t, dt);
  drawGiftFx(t, dt);
  requestAnimationFrame(frame);
}
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
layout();
seedAmbient();
requestAnimationFrame(frame);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fitTitle, noop);
startDarts();
})();
</script>
